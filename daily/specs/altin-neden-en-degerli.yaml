copy:
  title: 'Why Is Gold the Most Valuable Metal? #Shorts'
  hook: Gold's value isn't just about rarity; it's unique density, corrosion resistance, and luster make it truly special.
  caption: Gold stands out as the most valuable metal due to its exceptional properties. Its high density means more mass in a smaller volume. Gold's corrosion resistance prevents it from tarnishing or
    reacting with other elements, maintaining its purity. Finally, its unique luster, a specific way it reflects light, gives it an unparalleled shine that lasts. These combined characteristics make gold
    a rare and highly sought-after element.
