script:
- Cats purr at a frequency between 25 and 150 Hertz.
- This sound is not just for happiness.
- The purr involves the brain, the larynx, and the diaphragm.
- A neural oscillator in the brain sends rhythmic signals.
- These signals reach the larynx, causing vocal folds to vibrate.
- The neural oscillator drives the larynx.
- The diaphragm muscles contract and relax, changing air pressure for the purr.
- The purr sounds the same whether a cat is happy, stressed, or healing.
- This means purring has multiple functions beyond contentment.
- Purring is a complex signal, not just a sign of a happy cat.
