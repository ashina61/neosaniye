script:
  - "Sunlight is white. The sky is blue. The sunset is red."
  - "Same light, same air. The difference is distance."
  - "Air molecules scatter short wavelengths far more than long ones."
  - "Blue gets bounced around the sky in every direction."
  - "Straight up, that scattered blue is most of what reaches you."
  - "At sunset the light crosses far more air."
  - "By then the blue has been scattered away entirely."
  - "What's left is the red that never bounced."

