script:
  - "Someone yawns. Seconds later, so do you. You had no say in it."
  - "It isn't about oxygen. Your blood was never short of it."
  - "A yawn you catch and a yawn you start are different things."
  - "Spontaneous yawning shows up before birth."
  - "Catching one doesn't appear until around age four or five."
  - "That gap is the clue. Contagion is learned social wiring."
  - "Watching the action quietly runs the same motor pattern in you."
  - "And it scales with closeness. Family catches it more than strangers."
  - "Chimpanzees catch them. So do dogs, watching their owners."
  - "A yawn isn't a need for air. It's a social echo."

