script:
  - "Your own voice on a recording sounds wrong. Thinner. Higher."
  - "The recording is right. Your ears have been lying."
  - "When you speak, sound reaches you two ways."
  - "Through the air, the way everyone else hears you."
  - "And through the bone of your skull."
  - "Bone carries low frequencies far better than air."
  - "So your head adds a bass boost no one else hears."
  - "That thinner voice is the one the world knows."

