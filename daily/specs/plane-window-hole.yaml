copy:
  title: 'Why Does Every Plane Window Have A Tiny Hole? #Shorts'
  hook: The tiny hole in airplane windows isn't a flaw; it's a vital safety feature.
  caption: 'That small hole in an airplane window serves a critical safety function. It''s a ''bleed hole'' that equalizes pressure between the outer and middle panes, ensuring the outer pane bears the
    full pressure load. This design creates a crucial backup: if the outer pane ever fails, the middle pane is ready to take over and maintain cabin pressure.'
