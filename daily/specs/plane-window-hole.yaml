slug: plane-window-hole
title: Why Does Every Plane Window Have A Tiny Hole?
stock_fallback: clouds from plane
duration: 40.0
mood: curious
seed: 1101576
script:
- Every airplane window has a tiny hole in it.
- This is not a defect or an accident.
- 'The window is three panes: an outer pane, a middle pane, and an inner pane.'
- The outer pane carries the primary pressure load.
- The inner pane is a scratch shield.
- The bleed hole makes the middle pane carry no pressure load.
- This ensures the outer pane takes the full pressure load.
- If the outer pane fails, the middle pane becomes the primary load bearer.
- This design provides crucial redundancy for cabin pressure.
- The tiny hole keeps everyone safe at cruising altitude.
