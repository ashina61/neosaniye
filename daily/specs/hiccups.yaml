script:
- Hiccups are a mystery, but they always stop.
- No, it is not your breathing, or your stomach.
- It is a reflex arc, involving two key parts.
- The diaphragm is a large muscle below your lungs.
- The glottis is a valve at the top of your windpipe.
- A reflex arc spasms the diaphragm, then the glottis snaps shut.
- This sudden closure makes the characteristic 'hic' sound.
- When the reflex arc breaks, the hiccups finally subside.
- Your brain takes over, overriding the involuntary spasm.
- So, hiccups stop when your brain reclaims control.
