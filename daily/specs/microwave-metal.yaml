slug: microwave-metal
title: Why Can't You Put Metal in a Microwave? Explained!
stock_fallback: microwave oven interior
duration: 40.0
mood: tense
seed: 2261515
script:
- Metal in a microwave produces sparks and fire.
- Microwaves induce electric fields in metal.
- The metal in a microwave oven has edges and surfaces.
- Microwaves induce a current flow across the metal's surface.
- The induced current concentrates at any sharp edges of the metal.
- Edges concentrate the induced field until air breaks down and arcs.
- The concentrated energy at the edges is intense enough to ionize the air.
- Smooth metal, like a spoon, may not spark because it lacks sharp edges.
- This arcing damages both the microwave and the metal.
- This is why metal in a microwave produces sparks and fire.
