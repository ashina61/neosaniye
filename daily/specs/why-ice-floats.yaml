script:
  - "Almost every solid sinks in its own liquid. Water does the opposite."
  - "Ice floats, and that is genuinely strange."
  - "It comes down to how water molecules hold each other."
  - "In liquid water they tumble, packing close and loose by turns."
  - "Freezing locks each one into a rigid open lattice."
  - "That lattice holds them further apart than the liquid does."
  - "Same molecules, more space, so ice is less dense."
  - "Push it under and the water pushes back harder than gravity pulls."
  - "Lakes freeze from the top down, and the water below stays liquid."
  - "That quirk of packing is why life survives winter."

