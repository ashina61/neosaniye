name: Ses Boru Hattı Doğrulaması (plumbing — production-ready DEĞİL)

# YALNIZCA mikser + output-verification katmanını test eder. Mekanik/zorlanmış SFX
# (CREW_ENABLED=0 → her animasyonlu sınıra efekt). Sonuç sadece MIX_PIPELINE_PASS/FAIL.
# BU KOŞUDAN production-ready KARARI ÇIKMAZ (o real-editorial koşusundan çıkar).
# Upload çift kilitli: --no-upload + YouTube/Meta secret'ları verilmez.
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Zorlanacak konu (boş = Bee Honeycomb Hexagons)"
        type: string
        default: "Bee Honeycomb Hexagons"

concurrency:
  group: audio-plumbing-validation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plumbing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: ffmpeg kur
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python TTS araçları
        run: pip install -r requirements.txt
      - name: Node bağımlılıkları
        run: npm ci
      - name: Telifsiz müzik indir (best-effort)
        run: node scripts/fetch-music.js || true
        env:
          MUSIC_URLS: ${{ vars.MUSIC_URLS }}

      - name: Üret (MEKANİK SFX, upload KAPALI)
        id: produce
        run: node scripts/generate-and-publish.js --no-upload
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          TTS_VOICE: ${{ vars.TTS_VOICE }}
          CONTENT_LANGUAGE: "en"
          FORCE_TOPIC: ${{ inputs.topic }}
          MOTION_ENABLED: "1"
          MOTION_CTA_ENABLED: "1"
          MOTION_CTA_MODE: "always"
          MOTION_CTA_TYPES: "subscribe"
          # MEKANİK SFX zorlaması — SADECE mikser/output test için.
          CREW_ENABLED: "0"
          RETENTION_QC_MODE: ${{ vars.RETENTION_QC_MODE }}
          TECHNICAL_PREFLIGHT_MODE: ${{ vars.TECHNICAL_PREFLIGHT_MODE }}
          # YOUTUBE_* / META_* BİLEREK yok → yayın imkânsız.

      - name: Doğrula (plumbing)
        if: ${{ !cancelled() && steps.produce.conclusion == 'success' }}
        run: node scripts/real-production-validate.js --mode=plumbing

      - name: Artifact — plumbing doğrulaması
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-plumbing-validation-${{ github.run_number }}
          path: artifacts/real-production-validation/
          if-no-files-found: warn
          retention-days: 14

      - name: Artifact — ham üretim
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-production-plumbing-${{ github.run_number }}
          path: |
            output/**/*.mp4
            output/**/report.json
            output/**/production-report.json
          if-no-files-found: warn
          retention-days: 14
