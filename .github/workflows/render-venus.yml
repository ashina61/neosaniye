name: Render English Venus Short

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. 15:00 UTC = 18:00 Europe/Istanbul.
    - cron: '0 15 * * *'
  push:
    branches:
      - claude/youtube-shorts-automation-9dbrjx

permissions:
  contents: read

concurrency:
  group: neosaniye-daily-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          python -m pip install --disable-pip-version-check edge-tts==7.2.7

      - name: Generate English voice, timing, music and SFX
        run: npm run audio

      - name: Typecheck
        run: npm run typecheck

      - name: Render vertical short
        run: npm run render

      - name: Upload video and timing report
        uses: actions/upload-artifact@v4
        with:
          name: neosaniye-venus-english-${{ github.run_number }}
          path: |
            out/neosaniye-venus.mp4
            public/audio/voice.srt
            public/audio/narration.txt
            src/generated/timing.ts
          if-no-files-found: error
          retention-days: 7
