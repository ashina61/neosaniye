name: Koruma Bekçisi (parse + import)

# NEDEN: 07-23'te bir ajan generateScript.js'i geçersiz UTF-8 + escape'siz
# apostrofla, viewerFirstValidation.js'i kapanmayan regex'le bozdu; import
# zinciri çöktü ve daily-short cron ~15 koşu boyunca video ÜRETMEDEN patladı.
# Bu bekçi her push/PR'da src/ altındaki HER modülü parse + import eder;
# tam o hata sınıfını (SyntaxError / "missing /" / bozuk bayt / kırık import)
# SANİYELER içinde yakalar. ffmpeg/ağ/TTS YOK — hızlı ve deterministik.
# Yeşil olmayan hiçbir şey production cron'una ulaşmamalı.

on:
  push:
  pull_request:
  workflow_dispatch:

# Aynı ref'e üst üste push gelince eskisini iptal et (kota tasarrufu).
concurrency:
  group: guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Node bağımlılıkları
        run: npm ci

      - name: src/ parse + import bekçisi
        run: node scripts/guard-imports.js
