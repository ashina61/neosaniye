name: Validate episodes

# The cheap gate. Schema conformance and asset existence only — no bundle, no
# browser, no render. It answers "would this render at all?" in seconds so a
# typo in a file name never costs a render slot.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      episode_id:
        description: 'Episode folder to validate (blank = every episode)'
        required: false
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Config shape, scene types, and every referenced asset actually on disk.
      - name: Validate episode config and assets
        run: |
          if [ -n "${{ inputs.episode_id }}" ]; then
            npm run validate -- --episode="${{ inputs.episode_id }}"
          else
            npm run validate
          fi

      # The guards that keep the engine episode-agnostic, plus the schema tests.
      - name: Engine guards and schema tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck
