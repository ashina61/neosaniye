name: Render episode

# Renders ONE episode and hands back the mp4 as a build artifact.
#
# The episode is a runtime input, not a branch and not a code change: the same
# commit renders any episode in episodes/. That is the whole point of the
# folder layout, and this workflow is where it pays off.

on:
  workflow_dispatch:
    inputs:
      episode_id:
        description: 'Episode folder under episodes/ (e.g. test-episode)'
        required: true
        type: string
      crf:
        description: 'H.264 quality — lower is better, 18 is visually lossless'
        required: false
        default: '18'
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Fail on a missing asset before paying for a browser and a bundle.
      - name: Validate the episode
        run: npm run validate -- --episode="${{ inputs.episode_id }}"

      # Headless Chromium needs these shared libraries on a bare runner. The
      # sound library was renamed in Ubuntu 24.04, so try both names.
      - name: Install Chromium system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libdbus-1-3 libatk1.0-0t64 libgbm1 libxrandr2 libxfixes3 \
            libxcomposite1 libxdamage1 libatk-bridge2.0-0t64 libpango-1.0-0 \
            libcairo2 libcups2t64 libxkbcommon0 \
            || sudo apt-get install -y \
            libnss3 libdbus-1-3 libatk1.0-0 libgbm1 libxrandr2 libxfixes3 \
            libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 \
            libcairo2 libcups2 libxkbcommon0
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Download the Remotion browser
        run: npx remotion browser ensure

      - name: Render
        env:
          # Two runners' worth of cores; more tabs than that on a hosted runner
          # thrash rather than help.
          REMOTION_CONCURRENCY: '2'
        run: npm run render -- --episode="${{ inputs.episode_id }}" --crf="${{ inputs.crf }}"

      - name: Upload the mp4
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.episode_id }}-mp4
          path: out/${{ inputs.episode_id }}.mp4
          if-no-files-found: error
          retention-days: 14
