name: Persist Factory Source

on:
  pull_request:
    branches:
      - claude/youtube-shorts-automation-9dbrjx
    paths:
      - '.persist-trigger'

permissions:
  contents: write

jobs:
  persist:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.head_ref }}
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1

      - name: Install clean source tree
        run: |
          cat .bootstrap/factory.part-* | base64 --decode > /tmp/neosaniye-factory.tar.gz
          echo 'eb57cbb8312d2bd3f78c3d17ae66697a9eb8b125065d5447c2c525153223fde1  /tmp/neosaniye-factory.tar.gz' | sha256sum --check
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/neosaniye-factory.tar.gz -C .
          rm -rf .github
          git checkout HEAD -- .github .bootstrap-trigger .persist-trigger

      - name: Commit and diagnose push
        run: |
          git config user.name 'neosaniye-bot'
          git config user.email 'neosaniye-bot@users.noreply.github.com'
          git add -A
          git commit -m 'Install automated Remotion factory source [skip factory]'
          set +e
          git push origin HEAD:${TARGET_BRANCH} > /tmp/persist.log 2>&1
          code=$?
          set -e
          cat /tmp/persist.log
          mkdir -p diagnostic
          cp /tmp/persist.log diagnostic/persist.log
          echo "$code" > diagnostic/exit-code.txt

      - name: Upload persistence diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: neosaniye-persist-diagnostic
          path: diagnostic
          retention-days: 7
