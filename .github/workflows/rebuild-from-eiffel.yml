name: Rebuild NeoSaniye From Approved Eiffel Engine

on:
  push:
    branches: [agent/clean-eiffel-rebuild]
    paths:
      - .github/workflows/rebuild-from-eiffel.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout NeoSaniye rebuild branch
        uses: actions/checkout@v4
        with:
          ref: agent/clean-eiffel-rebuild
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Fetch the exact approved Eiffel source
        run: |
          rm -rf /tmp/neosaniye-eiffel-source
          git clone --no-checkout https://github.com/ashina61/neosaniye-remotion-lab.git /tmp/neosaniye-eiffel-source
          git -C /tmp/neosaniye-eiffel-source checkout 1661e9707103096d81e95531cb8ff098fb8fdaf9
          test "$(git -C /tmp/neosaniye-eiffel-source rev-parse HEAD)" = "1661e9707103096d81e95531cb8ff098fb8fdaf9"

      - name: Delete the legacy repository and install only the Eiffel engine
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          install -D /tmp/neosaniye-eiffel-source/src/index.ts src/index.ts
          install -D /tmp/neosaniye-eiffel-source/src/shorts/EiffelTowerShort.tsx src/shorts/EiffelTowerShort.tsx
          install -D /tmp/neosaniye-eiffel-source/src/shorts/CollageKit.tsx src/shorts/CollageKit.tsx
          install -D /tmp/neosaniye-eiffel-source/src/engine/FilmTreatment.tsx src/engine/FilmTreatment.tsx
          install -D /tmp/neosaniye-eiffel-source/src/engine/motion.ts src/engine/motion.ts
          install -D /tmp/neosaniye-eiffel-source/scripts/generate-eiffel-audio.py scripts/generate-eiffel-audio.py
          install -D /tmp/neosaniye-eiffel-source/tsconfig.json tsconfig.json

          if [ -f /tmp/neosaniye-eiffel-source/.gitignore ]; then
            cp /tmp/neosaniye-eiffel-source/.gitignore .gitignore
          else
            printf 'node_modules/\nout/\npublic/audio/\n' > .gitignore
          fi

          python - <<'PY'
          from pathlib import Path
          path = Path('src/shorts/CollageKit.tsx')
          text = path.read_text()
          start = text.find('export const CaptionStrip')
          end = text.find('export const Sparkles', start)
          if start >= 0 and end > start:
              text = text[:start] + text[end:]
          path.write_text(text)
          PY

          cat > src/Root.tsx <<'EOF'
          import React from 'react';
          import {Composition} from 'remotion';
          import {EIFFEL_SHORT_DURATION, EiffelTowerShort} from './shorts/EiffelTowerShort';

          export const RemotionRoot: React.FC = () => (
            <Composition
              id="NeoSaniyeEiffelTower"
              component={EiffelTowerShort}
              durationInFrames={EIFFEL_SHORT_DURATION}
              fps={30}
              width={1080}
              height={1920}
            />
          );
          EOF

          cat > package.json <<'EOF'
          {
            "name": "neosaniye-premium-motion-factory",
            "version": "1.0.0",
            "private": true,
            "description": "NeoSaniye subtitle-free procedural Remotion motion-graphics factory",
            "scripts": {
              "studio": "remotion studio src/index.ts",
              "audio": "python scripts/generate-eiffel-audio.py",
              "typecheck": "tsc --noEmit",
              "render": "remotion render src/index.ts NeoSaniyeEiffelTower out/neosaniye-eiffel-tower.mp4 --codec=h264 --crf=17 --pixel-format=yuv420p",
              "validate": "npm run typecheck && npm run render"
            },
            "dependencies": {
              "@remotion/cli": "4.0.499",
              "remotion": "4.0.499",
              "react": "19.1.1",
              "react-dom": "19.1.1"
            },
            "devDependencies": {
              "@types/react": "19.1.10",
              "@types/react-dom": "19.1.7",
              "typescript": "5.9.2"
            }
          }
          EOF

          cat > README.md <<'EOF'
          # NeoSaniye Premium Motion Factory

          Bu depo, onaylanan Eyfel Kulesi çıktısını üreten temiz Remotion motorudur.

          ## Kesin kurallar

          - Video içi altyazı yoktur.
          - Caption/karaoke şeridi yoktur.
          - Stock, Pexels, Pixabay veya AI görsel üretimi yoktur.
          - Görüntünün tamamı React, CSS ve SVG ile çizilir.
          - Seslendirme, müzik ve katmanlı SFX vardır.
          - Çıktı 1080x1920, 30 FPS, H.264/AAC'tir.

          Eski NeoSaniye fabrikası `backup/legacy-factory-before-eiffel-rebuild` dalında arşivlenmiştir.
          EOF

          mkdir -p .github/workflows
          cat > .github/workflows/validate.yml <<'EOF'
          name: Validate Clean NeoSaniye Motion Factory

          on:
            workflow_dispatch:
            push:
              branches:
                - agent/clean-eiffel-rebuild
                - claude/youtube-shorts-automation-9dbrjx
            pull_request:

          permissions:
            contents: read

          jobs:
            render:
              runs-on: ubuntu-latest
              timeout-minutes: 40
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: "22"
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.11"
                - name: Install ffmpeg
                  run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
                - name: Install dependencies
                  run: |
                    npm install --no-audit --no-fund
                    python -m pip install --disable-pip-version-check edge-tts==7.2.7 mutagen==1.47.0
                - name: Enforce subtitle-free procedural-only source
                  run: |
                    if grep -RniE 'CaptionStrip|subtitle|karaoke|generateImages|Pexels|Pixabay|OffthreadVideo|<Img|<video' src package.json; then
                      echo "Forbidden legacy media or subtitle code found"
                      exit 1
                    fi
                    test "$(find src -type f | wc -l)" -eq 6
                - name: Generate narration music and SFX
                  run: npm run audio
                - name: Typecheck
                  run: npm run typecheck
                - name: Render exact Eiffel-quality fixture
                  run: npm run render
                - name: Validate MP4
                  run: |
                    test -s out/neosaniye-eiffel-tower.mp4
                    ffprobe -v error -show_entries stream=codec_name,width,height,channels -show_entries format=duration -of json out/neosaniye-eiffel-tower.mp4 | tee out/ffprobe.json
                    python - <<'PY'
                    import json
                    data=json.load(open('out/ffprobe.json'))
                    streams=data['streams']
                    video=next(s for s in streams if s.get('width'))
                    audio=next(s for s in streams if s.get('channels'))
                    duration=float(data['format']['duration'])
                    assert video['codec_name']=='h264', video
                    assert (video['width'],video['height'])==(1080,1920), video
                    assert audio, 'audio stream missing'
                    assert 43.5 <= duration <= 44.5, duration
                    PY
                - uses: actions/upload-artifact@v4
                  with:
                    name: neosaniye-clean-eiffel-engine
                    path: |
                      out/neosaniye-eiffel-tower.mp4
                      out/ffprobe.json
                    if-no-files-found: error
                    retention-days: 7
          EOF

          if grep -RniE 'CaptionStrip|subtitle|karaoke|generateImages|Pexels|Pixabay|OffthreadVideo|<Img|<video' src package.json; then
            echo "Forbidden legacy media or subtitle code survived the replacement"
            exit 1
          fi
          test "$(find src -type f | wc -l)" -eq 6

      - name: Install and render before committing
        run: |
          npm install --no-audit --no-fund
          python -m pip install --disable-pip-version-check edge-tts==7.2.7 mutagen==1.47.0
          npm run audio
          npm run typecheck
          npm run render
          test -s out/neosaniye-eiffel-tower.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height,channels -show_entries format=duration -of json out/neosaniye-eiffel-tower.mp4 | tee out/ffprobe.json

      - name: Commit the clean replacement
        run: |
          rm -rf node_modules out public/audio
          git config user.name "neosaniye-clean-rebuild"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: replace legacy factory with approved subtitle-free Eiffel engine"
          git push origin HEAD:agent/clean-eiffel-rebuild

      - name: Upload validated preview
        uses: actions/upload-artifact@v4
        with:
          name: neosaniye-eiffel-clean-rebuild-preview
          path: /tmp/neosaniye-eiffel-source/README.md
          if-no-files-found: warn
          retention-days: 1
