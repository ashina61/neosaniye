name: Render Preview — No Upload

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neosaniye-preview
  cancel-in-progress: true

jobs:
  render-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      UPLOAD_ENABLED: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Safety lock — uploads disabled
        run: |
          test "$UPLOAD_ENABLED" = "false"
          test ! -f scripts/upload.mjs
          echo "Preview mode only. No platform upload code is present in this workflow."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          npm install --no-audit --no-fund
          python -m pip install --disable-pip-version-check edge-tts==7.2.7

      - name: Generate audio and render preview
        run: npm run build:short

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: neosaniye-first-traffic-light-preview
          path: |
            out/neosaniye-first-traffic-light.mp4
            public/audio/narration.txt
            public/audio/voice.srt
            content/topics/first-traffic-light.json
          if-no-files-found: error
          retention-days: 7
