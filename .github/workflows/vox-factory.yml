name: NeoSaniye Vox Factory — Render and Upload

on:
  workflow_dispatch:
    inputs:
      topic:
        description: Documentary topic or central question
        required: true
        default: The world's first traffic signal exploded
        type: string
      language:
        description: Narration language
        required: true
        default: en
        type: choice
        options: [en, tr]
      scene_count:
        description: Number of generated collage scenes
        required: true
        default: '10'
        type: choice
        options: ['8', '9', '10', '11', '12']
      facts:
        description: Optional verified facts
        required: false
        default: ''
        type: string
      story_providers:
        description: Text provider fallback order
        required: true
        default: gemini,groq,cerebras,github-models,mistral,cloudflare,openrouter
        type: string
      image_providers:
        description: Image provider fallback order
        required: true
        default: gemini,openai,bfl,stability,pollinations,cloudflare,together
        type: string
      privacy:
        description: YouTube visibility
        required: true
        default: public
        type: choice
        options: [public, unlisted, private]
  push:
    branches:
      - claude/youtube-shorts-automation-9dbrjx
    paths:
      - .github/workflows/vox-factory.yml
      - scripts/upload-youtube.mjs

permissions:
  contents: read
  models: read

concurrency:
  group: neosaniye-vox-upload
  cancel-in-progress: false

jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      UPLOAD_ENABLED: 'true'
      VIDEO_TOPIC: ${{ inputs.topic || vars.DAILY_TOPIC || 'The world''s first traffic signal exploded' }}
      VIDEO_LANGUAGE: ${{ inputs.language || 'en' }}
      VIDEO_SCENE_COUNT: ${{ inputs.scene_count || '10' }}
      VIDEO_FACTS: ${{ inputs.facts || '' }}
      STORY_PROVIDER_CHAIN: ${{ inputs.story_providers || 'gemini,groq,cerebras,github-models,mistral,cloudflare,openrouter' }}
      IMAGE_PROVIDER_CHAIN: ${{ inputs.image_providers || 'gemini,openai,bfl,stability,pollinations,cloudflare,together' }}
      YOUTUBE_PRIVACY: ${{ inputs.privacy || 'public' }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GITHUB_MODELS_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BFL_API_KEY: ${{ secrets.BFL_API_KEY }}
      FLUX_API_KEY: ${{ secrets.FLUX_API_KEY }}
      STABILITY_API_KEY: ${{ secrets.STABILITY_API_KEY }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL || 'gemini-3.5-flash-lite' }}
      GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL || 'gemini-3.1-flash-image' }}
      GEMINI_IMAGE_SIZE: ${{ vars.GEMINI_IMAGE_SIZE || '1K' }}
      GITHUB_MODELS_MODEL: ${{ vars.GITHUB_MODELS_MODEL || 'openai/gpt-4o' }}
      OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-1.5' }}
      OPENAI_IMAGE_QUALITY: ${{ vars.OPENAI_IMAGE_QUALITY || 'medium' }}
      BFL_IMAGE_MODEL: ${{ vars.BFL_IMAGE_MODEL || 'flux-2-pro' }}
      STABILITY_IMAGE_MODEL: ${{ vars.STABILITY_IMAGE_MODEL || 'core' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload configuration check
        run: |
          test "$UPLOAD_ENABLED" = "true"
          test -n "$YOUTUBE_CLIENT_ID"
          test -n "$YOUTUBE_CLIENT_SECRET"
          test -n "$YOUTUBE_REFRESH_TOKEN"
          echo "VOX render and YouTube upload enabled."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          npm install --no-audit --no-fund
          python -m pip install --disable-pip-version-check edge-tts==7.2.7

      - name: Generate story
        run: |
          npm run factory:preflight
          npm run story:generate

      - name: Generate editorial collage images
        run: npm run images:generate

      - name: Compile story for Remotion
        run: npm run story:compile

      - name: Generate voice, music, SFX and timing
        run: npm run audio

      - name: Quality checks
        run: |
          npm test
          npm run typecheck

      - name: Render MP4
        run: npm run render

      - name: Upload YouTube Short
        run: node scripts/upload-youtube.mjs

      - name: Upload factory diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neosaniye-vox-${{ github.run_number }}
          path: |
            out/neosaniye-vox.mp4
            out/factory/**
            content/generated/current-story.json
            public/generated/**
            public/audio/narration.txt
            public/audio/voice.srt
            public/audio/voice-selection.json
          if-no-files-found: warn
          retention-days: 7
