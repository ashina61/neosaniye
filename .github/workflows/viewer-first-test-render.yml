name: Viewer-First Test Render (No Upload)

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Exact test topic (optional)"
        required: false
        type: string
      format:
        description: "Content format"
        required: true
        default: howworks
        type: choice
        options: [howworks, story, process, facts3, whatif]
      style:
        description: "Visual style"
        required: true
        default: photo
        type: choice
        options: [photo, animated]

permissions:
  contents: read

concurrency:
  group: viewer-first-test-render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: |
          npm ci
          pip install -r requirements.txt

      - name: Run viewer-first regression tests
        run: npm test

      - name: Render one test Short with publishing disabled
        run: node scripts/generate-and-publish.js --no-upload
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: openrouter/free
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          FORCE_TOPIC: ${{ inputs.topic }}
          FORCE_FORMAT: ${{ inputs.format }}
          VIDEO_STYLE: ${{ inputs.style }}
          RETENTION_QC_MODE: strict
          GITHUB_ACTIONS: "true"

      - name: Upload rendered review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-first-test-render-${{ github.run_number }}
          path: |
            output/**/*.mp4
            output/**/production-report.json
            output/**/production-report.md
            output/**/report.json
            output/**/asset-manifest.json
            output/**/preview-*.jpg
          if-no-files-found: error
          retention-days: 14
