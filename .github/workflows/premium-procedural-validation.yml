name: Premium Procedural Factory Validation

on:
  pull_request:
    branches: [claude/youtube-shorts-automation-9dbrjx]
  push:
    branches: [agent/premium-procedural-factory]

permissions:
  contents: read

concurrency:
  group: premium-procedural-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout premium branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and ffprobe
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Apply premium pipeline migration in workspace
        run: node scripts/apply-premium-procedural-migration.mjs

      - name: Install pipeline dependencies
        run: npm ci

      - name: Install Remotion renderer
        run: npm install --prefix remotion --no-audit --no-fund

      - name: Validate procedural-only architecture
        run: npm run test:remotion

      - name: Run complete Node test suite
        id: node-tests
        continue-on-error: true
        run: |
          set -o pipefail
          npm test 2>&1 | tee premium-node-tests.log

      - name: Typecheck premium Remotion engine
        run: npm run remotion:typecheck

      - name: Render premium procedural fixture
        id: fixture
        continue-on-error: true
        run: |
          set -o pipefail
          npm run remotion:fixture 2>&1 | tee premium-render.log

      - name: Validate fixture MP4
        id: fixture-audit
        if: steps.fixture.outcome == 'success'
        continue-on-error: true
        run: |
          V=remotion/out/neosaniye-fixture.mp4
          test -s "$V"
          ffprobe -v error -show_entries stream=codec_name,width,height,channels -show_entries format=duration -of json "$V" | tee premium-ffprobe.json
          node scripts/audit-final-video.js "$V" --fps 2 2>&1 | tee premium-audit.log

      - name: Export migrated source and diagnostics
        if: always()
        run: |
          mkdir -p premium-validation-export/src/pipeline
          cp src/pipeline/run.js premium-validation-export/src/pipeline/run.js
          cp src/pipeline/retentionQC.js premium-validation-export/src/pipeline/retentionQC.js
          cp src/pipeline/emergencyQualityGate.js premium-validation-export/src/pipeline/emergencyQualityGate.js
          cp premium-node-tests.log premium-validation-export/premium-node-tests.log 2>/dev/null || true
          cp premium-render.log premium-validation-export/premium-render.log 2>/dev/null || true
          cp premium-ffprobe.json premium-validation-export/premium-ffprobe.json 2>/dev/null || true
          cp premium-audit.log premium-validation-export/premium-audit.log 2>/dev/null || true
          cp remotion/out/neosaniye-fixture.mp4 premium-validation-export/fixture.mp4 2>/dev/null || true

      - name: Upload premium validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-procedural-validation
          path: premium-validation-export
          if-no-files-found: error
          retention-days: 3

      - name: Enforce premium validation gates
        if: steps.node-tests.outcome != 'success' || steps.fixture.outcome != 'success' || steps.fixture-audit.outcome == 'failure'
        run: exit 1
