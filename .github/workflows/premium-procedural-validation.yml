name: Premium Procedural Factory Validation

on:
  pull_request:
    branches: [claude/youtube-shorts-automation-9dbrjx]
  push:
    branches: [agent/premium-procedural-factory]

permissions:
  contents: write

concurrency:
  group: premium-procedural-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout premium branch
        uses: actions/checkout@v4
        with:
          ref: agent/premium-procedural-factory
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and ffprobe
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Apply pending premium migrations and physical prune
        id: prune
        continue-on-error: true
        run: |
          set -o pipefail
          {
            if [ -f scripts/apply-premium-procedural-migration.mjs ]; then node scripts/apply-premium-procedural-migration.mjs; fi
            if [ -f scripts/apply-premium-test-migration.mjs ]; then node scripts/apply-premium-test-migration.mjs; fi
            if [ -f scripts/finalize-premium-source.mjs ]; then node scripts/finalize-premium-source.mjs; fi
            if [ -f scripts/prune-premium-legacy.mjs ]; then node scripts/prune-premium-legacy.mjs; fi
          } 2>&1 | tee premium-prune.log

      - name: Install pipeline dependencies
        if: ${{ steps.prune.outcome == 'success' }}
        run: npm ci

      - name: Install Remotion renderer
        if: ${{ steps.prune.outcome == 'success' }}
        run: npm install --prefix remotion --no-audit --no-fund

      - name: Install fixture TTS
        if: ${{ steps.prune.outcome == 'success' }}
        run: python -m pip install --disable-pip-version-check edge-tts==7.2.7

      - name: Generate fixture audio
        if: ${{ steps.prune.outcome == 'success' }}
        run: |
          python scripts/generate-remotion-fixture-audio.py
          if [ -f remotion/public/runs/fixture/voice.mp3 ]; then
            ffmpeg -y -v error -i remotion/public/runs/fixture/voice.mp3 -ar 22050 -ac 1 remotion/public/runs/fixture/voice.wav
          fi
          test -s remotion/public/runs/fixture/voice.wav
          test -s remotion/public/runs/fixture/music.wav
          test -s remotion/public/runs/fixture/whoosh.wav
          test -s remotion/public/runs/fixture/boom.wav

      - name: Validate procedural-only architecture
        if: ${{ steps.prune.outcome == 'success' }}
        run: npm run test:remotion

      - name: Run complete Node test suite
        id: node_tests
        if: ${{ steps.prune.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -o pipefail
          npm test 2>&1 | tee premium-node-tests.log

      - name: Typecheck premium Remotion engine
        if: ${{ steps.prune.outcome == 'success' }}
        run: npm run remotion:typecheck

      - name: Render premium procedural fixture
        id: fixture
        if: ${{ steps.prune.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p artifacts
          npm run remotion:fixture 2>&1 | tee premium-render.log
          test -s artifacts/remotion-fixture.mp4
          if grep -Eq "An error occurred|TypeError|Error while downloading|Received a status code of 404" premium-render.log; then exit 1; fi

      - name: Validate fixture MP4
        id: fixture_audit
        if: ${{ steps.fixture.outcome == 'success' }}
        continue-on-error: true
        run: |
          V=artifacts/remotion-fixture.mp4
          test -s "$V"
          ffprobe -v error -show_entries stream=codec_name,width,height,channels -show_entries format=duration -of json "$V" | tee premium-ffprobe.json
          node scripts/audit-final-video.js "$V" --fps 2 2>&1 | tee premium-audit.log

      - name: Export diagnostics
        if: always()
        run: |
          mkdir -p premium-validation-export/src/pipeline
          cp premium-prune.log premium-validation-export/premium-prune.log 2>/dev/null || true
          cp src/pipeline/run.js premium-validation-export/src/pipeline/run.js 2>/dev/null || true
          cp src/pipeline/retentionQC.js premium-validation-export/src/pipeline/retentionQC.js 2>/dev/null || true
          cp src/pipeline/emergencyQualityGate.js premium-validation-export/src/pipeline/emergencyQualityGate.js 2>/dev/null || true
          cp premium-node-tests.log premium-validation-export/premium-node-tests.log 2>/dev/null || true
          cp premium-render.log premium-validation-export/premium-render.log 2>/dev/null || true
          cp premium-ffprobe.json premium-validation-export/premium-ffprobe.json 2>/dev/null || true
          cp premium-audit.log premium-validation-export/premium-audit.log 2>/dev/null || true
          cp artifacts/remotion-fixture.mp4 premium-validation-export/fixture.mp4 2>/dev/null || true

      - name: Upload premium validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-procedural-validation
          path: premium-validation-export
          if-no-files-found: error
          retention-days: 3

      - name: Enforce premium validation gates
        if: ${{ steps.prune.outcome != 'success' || steps.node_tests.outcome != 'success' || steps.fixture.outcome != 'success' || steps.fixture_audit.outcome != 'success' }}
        run: exit 1

      - name: Persist validated physical prune
        if: ${{ steps.prune.outcome == 'success' && steps.node_tests.outcome == 'success' && steps.fixture.outcome == 'success' && steps.fixture_audit.outcome == 'success' }}
        run: |
          rm -f scripts/apply-premium-procedural-migration.mjs scripts/apply-premium-test-migration.mjs scripts/finalize-premium-source.mjs scripts/prune-premium-legacy.mjs
          if ! git diff --quiet || [ -n "$(git ls-files --deleted)" ]; then
            git config user.name "neosaniye-premium-migration"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "refactor: physically remove legacy media and caption systems"
            git push origin HEAD:agent/premium-procedural-factory
          else
            echo "premium physical prune already persisted"
          fi
