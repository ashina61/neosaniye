name: Kolaj parça denemesi — Manuel, 4-5 görsel

# NE YAPAR
#
# B yolunun MALZEME kolunu uçtan uca dener: prompt üret → görsel üret →
# magenta zemini sil → alfa doğrula → storyboard'a bağla → tek kare render et.
# Sonuçları artefakt olarak yükler.
#
# NEDEN AYRI BİR WORKFLOW (render.yml'e eklenmedi)
#
# render.yml 45 dakikalık tam video render'ı yapıyor. Buradaki soru başka:
# "üretilen parçalar işe yarıyor mu". O soruyu cevaplamak için tam video
# gerekmiyor ve ölçüldü ki tam render bu makinede 93 dakika — bir prompt
# denemesi için o döngü kullanılamaz. Bu iş birkaç dakika sürer.
#
# NEDEN ACTIONS'TA, YEREL DEĞİL
#
# Geliştirme konteynerinin egress politikası görsel sağlayıcılarını
# engelliyor. Proxy kayıtlarıyla ÖLÇÜLDÜ: image.pollinations.ai, api.openai.com,
# api.stability.ai, fal.run, huggingface.co hepsi "gateway answered 403 to
# CONNECT". Açık olan tek host generativelanguage.googleapis.com ve orada da
# anahtarın görsel kotası 0 (metin çağrısı çalışıyor, bütün görsel modelleri
# 429 veriyor — faturalandırma kapalı).
#
# Actions runner'ında o politika yok. Pollinations anahtarsız ve ücretsiz,
# yani bu iş SECRET OLMADAN da çalışır.
#
# MANUEL. Cron yok, push tetikleyicisi yok, upload yok — AGENTS.md kuralı.

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Kaç görsel üretilsin (deneme için 4-5 yeterli)"
        required: true
        default: "5"
        type: string
      provider_chain:
        description: "Sağlayıcı sırası — ilki hata verirse sıradakine düşer"
        required: true
        default: "gemini,pollinations"
        type: choice
        options:
          - gemini,pollinations
          - pollinations
          - pollinations,gemini
          - gemini
      topic:
        description: "Konu dosyası"
        required: true
        default: "content/story-db-cooper.json"
        type: string
      include_plates:
        description: "Zemin plakalarını da üret (varsayılan HAYIR — PaperBase zaten çiziyor)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: neosaniye-collage-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          # `python -m pip` ile kurup `python3` ile çalıştırmak, ikisi farklı
          # yorumlayıcıya çözülürse import hatası verir. Aynısı kullanılıyor.
          python3 -m pip install --disable-pip-version-check --quiet pillow numpy
          # SEGMENTASYON. Zemini modelden istemeyi bıraktık; özneyi biz
          # kesiyoruz (gerekçe ve ölçüm: pipeline/segment.py). Kurulum
          # başarısız olursa iş DURMAZ — cutout.py matte/ink'e düşer ve
          # ingest adımı bunu "YEDEK MOD" diye yüksek sesle raporlar.
          python3 -m pip install --disable-pip-version-check --quiet rembg onnxruntime || \
            echo "UYARI: rembg kurulamadı — segmentasyon yok, yedek modlara düşülecek"

      # Model ağırlığı 179 MB ve GitHub releases'ten iniyor. Üretim adımından
      # ÖNCE indiriliyor ki 8 görsel üretildikten sonra indirme patlamasın.
      - name: Segmentasyon modelini önceden indir
        continue-on-error: true
        run: |
          python3 - <<'PY'
          from rembg import new_session
          new_session("isnet-general-use")
          print("segmentasyon modeli hazır")
          PY

      # TESTLER BURADA, SONDA DEĞİL — ve sebebi ölçüldü.
      #
      # İlk sürümde testler en sonda çalışıyordu ve 62 testin TAP çıktısı
      # (~250 satır) logun kuyruğunu tamamen dolduruyordu. Log okuma aracı
      # kuyruktan ~330 satır veriyor, yani ASIL SORULACAK ŞEY — hangi
      # sağlayıcı üretti, alfa geçti mi — erişilemez hâle geliyordu.
      #
      # Testler girdiye bağlı değil; önce çalışmaları hiçbir şey kaybettirmiyor
      # ve bozuk bir depoyla üretim kotası harcamayı da engelliyor.
      - name: Typecheck + test
        run: |
          npm run typecheck
          npm test

      - name: Storyboard üret
        run: node pipeline/build-storyboard.mjs "${{ inputs.topic }}"

      - name: Prompt paketini üret
        run: npm run flow:pack

      # ASIL DENEME. Başarısız olursa iş DURUR (continue-on-error YOK) —
      # sebebi şu: bu workflow'un TEK işi malzemenin gelip gelmediğini
      # ölçmek. Sessizce geçip "malzeme yok, siluetle devam" demek sorunun
      # kendisini gizlerdi.
      - name: Parçaları üret (sağlayıcı zinciri)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          IMAGE_PROVIDER_CHAIN: ${{ inputs.provider_chain }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL || 'gemini-3-pro-image' }}
        run: |
          node pipeline/generate-cutouts.mjs --pack \
            --limit=${{ inputs.count }} \
            ${{ inputs.include_plates && '--include-plates' || '' }}

      # Magenta → alfa. `--strict` ile alfa ÖLÇÜLÜR; tamamen opak ya da
      # tamamen şeffaf çıktı reddedilir ve o parça bağlanmaz.
      - name: Alfa çıkar ve storyboard'a bağla
        run: npm run collage

      # Parçaların alfası GÖZLE görülebilsin diye dama zeminine dizilir.
      # Sadece PNG'lere bakmak yetmiyor: şeffaf bölge çoğu görüntüleyicide
      # beyaz görünüyor ve "kesilmiş mi kesilmemiş mi" ayırt edilemiyor.
      - name: Alfa kontakt sayfası
        if: always()
        run: |
          python3 - <<'PY'
          import os, glob
          from PIL import Image
          files = sorted(glob.glob('public/collage/*.png'))
          if not files:
              print('parça yok'); raise SystemExit
          CELL = 420
          def checker(w, h, s=24):
              im = Image.new('RGB', (w, h), (200, 200, 200))
              px = im.load()
              for y in range(h):
                  for x in range(w):
                      if ((x // s) + (y // s)) % 2: px[x, y] = (160, 160, 160)
              return im
          tiles = []
          for f in files:
              im = Image.open(f).convert('RGBA')
              im.thumbnail((CELL, CELL), Image.LANCZOS)
              bg = checker(CELL, CELL)
              bg.paste(im, ((CELL - im.width) // 2, (CELL - im.height) // 2), im)
              tiles.append(bg)
          cols = min(5, len(tiles)); rows = (len(tiles) + cols - 1) // cols
          sheet = Image.new('RGB', (cols * CELL, rows * CELL), (40, 40, 40))
          for i, t in enumerate(tiles):
              sheet.paste(t, ((i % cols) * CELL, (i // cols) * CELL))
          os.makedirs('out', exist_ok=True)
          sheet.save('out/alpha-sheet.png')
          print(f'{len(tiles)} parça → out/alpha-sheet.png')
          PY

      # Malzemesi gelen İLK sahnenin ortasından tek kare. Tam render değil:
      # soru "parçalar kompozisyonda nasıl duruyor", o tek kareden görülür.
      - name: Kompoze kareyi render et
        if: always()
        continue-on-error: true
        run: |
          FRAME=$(node -e "
            const sb=require('./content/storyboard.json');
            let t=0;
            for(const s of sb.scenes){
              if(s.template==='collage_build'){console.log(t+Math.round(s.durationInFrames*0.8));process.exit(0);}
              t+=s.durationInFrames;
            }
            console.error('collage_build sahnesi yok'); process.exit(1);
          ")
          echo "kare: $FRAME"
          npx remotion still src/index.ts Short out/composed-frame.png --frame=$FRAME

      # TEŞHİS ÖZETİ — LOGUN EN SONUNDA.
      #
      # Bu adım varlığını bir başarısızlığa borçlu: ilk çalıştırmada 5 görsel
      # üretildi ama hiçbiri storyboard'a bağlanmadı, ve sebebi logdan
      # OKUNAMADI çünkü test çıktısı kuyruğu doldurmuştu. Teşhis ancak
      # "13 dosya yüklendi" satırından geri sayarak tahmin edilebildi.
      #
      # Bir ölçümü tahmin ederek elde etmek zorunda kalmak, ölçümün eksik
      # olduğu anlamına gelir. Aşağıdaki blok kısa ve en sonda: her koşuda
      # cevabı doğrudan veriyor.
      - name: ÖZET — ne geldi, ne bağlandı, neden
        if: always()
        run: |
          echo "==================== TEŞHİS ===================="
          echo "ham görsel (collage-raw/): $(ls collage-raw/*.png 2>/dev/null | wc -l)"
          echo "kesilmiş  (public/collage/): $(ls public/collage/*.png 2>/dev/null | wc -l)"
          echo
          # ESKİ ÖLÇÜM ATILDI. Burada "zemin magenta mı" soruluyordu; sonra da
          # "zemin beyaz mı" sorulacaktı. İkisi de yanlış soru: 5. turda beş
          # görselin beşinde de zemin YOKTU (kenar-beyaz %0.0) ve hat yine de
          # devam etti, çünkü zeminin varlığına bel bağlıyordu.
          #
          # Doğru soru artık zeminle ilgili değil: KESİLDİ Mİ? Bunun ölçüsü
          # kesilmiş PNG'nin alfasında: opak oranı ve DIŞ ÇEPERİN doluluğu.
          # Kesilmemiş bir dikdörtgen çeperi doldurur (5. tur matte: %40'a
          # kadar); gerçek bir kesikte çeper boştur (5. tur seg: %0.0).
          echo "--- kesilmiş parçaların alfası: gerçekten kesilmiş mi? ---"
          python3 - <<'PY'
          import glob
          import numpy as np
          from PIL import Image
          files = [f for f in sorted(glob.glob('public/collage/*.png')) if '-plate' not in f]
          if not files:
              print("  parça YOK — hiçbiri alfa kapısını geçmemiş")
          for f in files:
              im = Image.open(f)
              if im.mode != 'RGBA':
                  print(f"  {f:36s} ALFA KANALI YOK — kesilmemiş"); continue
              a = np.asarray(im)[:, :, 3] / 255.0
              h, w = a.shape
              k = max(2, int(min(h, w) * 0.02))
              ring = np.zeros((h, w), bool)
              ring[:k, :] = ring[-k:, :] = True
              ring[:, :k] = ring[:, -k:] = True
              opak, ceper = (a > 0.6).mean(), (a[ring] > 0.6).mean()
              iyi = opak <= 0.78 and ceper <= 0.15
              print(f"  {f:36s} opak %{100*opak:5.1f}  çeper %{100*ceper:5.1f}"
                    f"  {'kesilmiş' if iyi else '>>> DİKDÖRTGEN, KESİLMEMİŞ <<<'}")
          PY
          echo
          echo "--- storyboard'a kaç sahne bağlandı? ---"
          node -e "
            const sb=require('./content/storyboard.json');
            const w=sb.scenes.filter(s=>s.payload.layers);
            console.log('  collage_build sahnesi:', sb.scenes.filter(s=>s.template==='collage_build').length, '/', sb.scenes.length);
            for(const s of w) console.log('   ', s._beat?.text?.slice(0,44), '→', s.payload.layers.pieces.length, 'parça');
            if(!w.length) console.log('  HİÇBİRİ. Parçalar alfa doğrulamasından düştü ya da hiç üretilemedi.');
          "
          echo "================================================"

      - name: Artefaktları yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kolaj-denemesi-${{ github.run_number }}
          path: |
            out/alpha-sheet.png
            out/composed-frame.png
            collage-raw/*.png
            public/collage/*.png
            content/storyboard.json
            out/flow-pack/ASSET-LIST.txt
          if-no-files-found: warn
          retention-days: 7
