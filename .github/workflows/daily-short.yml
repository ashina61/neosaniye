name: Günlük Short Üret ve Yayınla

# Viewer-first review workflow: manual only. Publishing and cron stay disabled.
on:
  workflow_dispatch:
    inputs:
      no_upload:
        description: "YouTube upload'ı atla (sadece üret)"
        type: boolean
        default: false
      style:
        description: "Görsel stil (auto = sistem karar verir)"
        type: choice
        options: [auto, animated, photo]
        default: auto
      format:
        description: "İçerik formatı (auto = rastgele; process = gerçek video + oklar)"
        type: choice
        options: [auto, process, story, howworks, facts3, whatif]
        default: auto
      slot:
        description: "Deney slotu (manuel run'lar varsayılan 'manual' kaydedilir)"
        type: choice
        options: [manual, "15:00", "20:00", "02:00"]
        default: manual

concurrency:
  group: daily-short
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: ffmpeg kur
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python TTS araçları
        run: pip install -r requirements.txt

      - name: Node bağımlılıkları
        run: npm ci

      - name: Telifsiz müzik indir (opsiyonel, best-effort)
        run: node scripts/fetch-music.js || true
        env:
          MUSIC_URLS: ${{ vars.MUSIC_URLS }}

      - name: Üret ve yayınla
        id: produce
        run: node scripts/generate-and-publish.js ${{ inputs.no_upload && '--no-upload' || '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RETENTION_QC_MODE: ${{ vars.RETENTION_QC_MODE }}
          RETENTION_MIN_SCORE: ${{ vars.RETENTION_MIN_SCORE }}
          # Teknik kapı retention'dan bağımsız (varsayılan strict — boş bırak).
          TECHNICAL_PREFLIGHT_MODE: ${{ vars.TECHNICAL_PREFLIGHT_MODE }}
          # 14 günlük yayın deneyi: manuel run'da slot elle seçilebilir;
          # cron'da boş kalır ve UTC saatinden deterministik tespit edilir.
          SCHEDULE_SLOT: ${{ inputs.slot }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # İkinci stok kaynağı + ambiyans (opsiyonel; yoksa özellik atlanır).
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          # Görsel stil zorlaması (manuel run'da seçilir; cron'da sistem karar verir).
          VIDEO_STYLE: ${{ inputs.style == 'auto' && '' || inputs.style }}
          # İçerik formatı zorlaması (test için; auto = rastgele rotasyon).
          FORCE_FORMAT: ${{ inputs.format == 'auto' && '' || inputs.format }}
          # Instagram + Facebook cross-post (opsiyonel; bkz. docs/meta-setup.md).
          # Tek zorunlu secret: META_USER_TOKEN. Sayfa + IG otomatik keşfedilir.
          META_USER_TOKEN: ${{ secrets.META_USER_TOKEN }}
          META_IG_LOGIN_TOKEN: ${{ secrets.META_IG_LOGIN_TOKEN }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ vars.META_PAGE_ID }}
          META_IG_USER_ID: ${{ vars.META_IG_USER_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # İlk çalıştırmalar için güvenli varsayılan: unlisted. Public için
          # Actions → Variables sekmesinden YOUTUBE_PRIVACY=public ekle.
          YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY || 'unlisted' }}
          TTS_VOICE: ${{ vars.TTS_VOICE }}
          # Bildirim (opsiyonel): Telegram botu ve/veya Discord webhook'u.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      # GÖZLEM (yalnızca okuma): kalıcı kayıtlar (videos.json + qc-history) yazıldıktan
      # SONRA rollout raporu üret. Render/motion/upload'a DOKUNMAZ; hata toleranslı —
      # rapor/log başarısızlığı job'ı ASLA düşürmez. Üretim adımı çalıştıysa çalışır
      # (produce skip edilmediyse); iptal edildiyse çalışmaz.
      - name: Motion rollout raporu (gözlem)
        if: ${{ !cancelled() && steps.produce.conclusion != 'skipped' }}
        run: |
          npm run motion:rollout-report || echo "[motion-rollout] report generation failed; production continues"
          node scripts/motion-rollout-log.js || echo "[motion-rollout] log helper failed; production continues"

      - name: Motion rollout raporunu artifact olarak sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-rollout-report-${{ github.run_number }}
          path: |
            artifacts/motion/rollout/rollout-report.json
            artifacts/motion/rollout/rollout-report.md
          if-no-files-found: ignore
          retention-days: 14

      - name: Üretilen videoyu artifact olarak sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-video
          path: |
            output/**/*.mp4
            output/**/publish-kit.txt
            output/**/report.json
            output/**/production-report.json
            output/**/production-report.md
            output/**/preview-*.jpg
          if-no-files-found: ignore
          retention-days: 7

      # Konu tekrarını önlemek için üretilen state'i branch'e geri yaz.
      # (Firebase yoksa dedup yalnızca böyle kalıcı olur.)
      - name: Dedup state'ini kalıcı yap
        if: always()
        run: |
          git config user.name "neosaniye-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/used_topics.json data/videos.json data/qc-history.jsonl || true
          if git diff --cached --quiet; then
            echo "state değişmedi, commit yok"
          else
            git commit -m "chore(state): used_topics/videos güncelle [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi
