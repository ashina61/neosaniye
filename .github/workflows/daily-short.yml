name: Günlük Short Üret ve Yayınla

# Manuel tetikleme her zaman açık; cron ile günlük otomatik üretim AKTİF.
on:
  workflow_dispatch:
    inputs:
      auto_upload:
        # YAYIN VARSAYILAN KAPALI (26 Tem güvenlik yaması).
        # Eski input `no_upload` idi ve TERS mantıkla çalışıyordu: bayrak
        # yalnızca işaretlenirse `--no-upload` geçiliyordu. `schedule`
        # tetiğinde input DİYE BİR ŞEY YOKTUR — ifade boş stringe düşüyor,
        # bayrak hiç geçmiyor ve cron "upload açık" modda koşuyordu.
        # Artık mantık DÜZ: yüklemek için bilinçli olarak işaretlemen gerek.
        description: "YouTube'a yükle (varsayılan HAYIR — QC'den geçmeyen video yayınlanamaz)"
        type: boolean
        default: false
      style:
        description: "Görsel stil (auto = sistem karar verir)"
        type: choice
        options: [auto, animated, photo]
        default: auto
      format:
        description: "İçerik formatı (auto = rastgele; process = gerçek video + oklar)"
        type: choice
        options: [auto, process, story, howworks, facts3, whatif]
        default: auto
      slot:
        description: "Deney slotu (manuel run'lar varsayılan 'manual' kaydedilir)"
        type: choice
        options: [manual, "15:00", "20:00", "02:00"]
        default: manual
      visual_fx:
        description: "Görsel anlatım katmanı (V2: etiket/sayaç/spotlight) — test için aç"
        type: boolean
        default: false
  schedule:
    # 14 GÜNLÜK ABD-İZLEYİCİ DENEYİ (us-audience-3-slots-v1): günde 3 sabit
    # slot — 15:00 / 20:00 / 02:00 UTC (TR yaz: 18:00 / 23:00 / 05:00).
    # Deney süresince saatler DEĞİŞTİRİLMEZ (docs/publishing-experiment.md).
    # Dakika +2 offset: GitHub tam saat (XX:00) tick'lerini iki kez yuttu —
    # slot kimliği yine 15:00/20:00/02:00, tespit scheduleExperiment.js'te.
    # 02:00 UTC koşusu bir önceki UTC içerik gününün 3. slotudur.
    - cron: "2 15 * * *" # slot 15:00 UTC — ABD Doğu 11:00 / Pasifik 08:00
    - cron: "2 20 * * *" # slot 20:00 UTC — ABD Doğu 16:00 / Pasifik 13:00
    - cron: "2 2 * * *"  # slot 02:00 UTC — ABD Doğu 22:00 / Pasifik 19:00 (önceki içerik günü)

concurrency:
  group: daily-short
  cancel-in-progress: false

permissions:
  contents: write # dedup state'ini (data/*.json) branch'e geri commit edebilmek için
  models: read # GitHub Models (ÜCRETSİZ yedek beyin) — ek anahtar gerektirmez

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: ffmpeg kur
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python TTS araçları
        run: pip install -r requirements.txt

      - name: Node bağımlılıkları
        run: npm ci

      - name: Telifsiz müzik indir (opsiyonel, best-effort)
        run: node scripts/fetch-music.js || true
        env:
          MUSIC_URLS: ${{ vars.MUSIC_URLS }}

      - name: Üret ve yayınla
        id: produce
        # Cron'da `inputs` yoktur → daima `--no-upload`. Manuel run'da yalnızca
        # auto_upload işaretliyse `--upload`. Varsayılan her koşulda GÜVENLİ.
        run: node scripts/generate-and-publish.js ${{ inputs.auto_upload && '--upload' || '--no-upload' }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: openrouter/free
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # EK ÜCRETSİZ BEYİNLER — hepsi opsiyonel, tanımlı olmayan sessizce atlanır.
          # GitHub Models ayrı kayıt istemez: Actions'ın kendi token'ı yeter.
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Ücretsiz GÖRSEL sağlayıcı yedekleri (Pollinations tek nokta olmasın).
          # Cloudflare metin tarafıyla AYNI kimlik bilgilerini kullanır.
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          # İKİNCİ EMNİYET: kod tarafındaki politika da bu değişkenleri okur.
          # Workflow bayrağı ile env aynı yönü göstermezse en kısıtlayıcı kazanır.
          AUTO_UPLOAD: ${{ inputs.auto_upload && 'true' || 'false' }}
          REQUIRE_MANUAL_APPROVAL: "true"
          RETENTION_QC_MODE: ${{ vars.RETENTION_QC_MODE }}
          RETENTION_MIN_SCORE: ${{ vars.RETENTION_MIN_SCORE }}
          # Teknik kapı retention'dan bağımsız (varsayılan strict — boş bırak).
          TECHNICAL_PREFLIGHT_MODE: ${{ vars.TECHNICAL_PREFLIGHT_MODE }}
          # 14 günlük yayın deneyi: manuel run'da slot elle seçilebilir;
          # cron'da boş kalır ve UTC saatinden deterministik tespit edilir.
          SCHEDULE_SLOT: ${{ inputs.slot }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # İkinci stok kaynağı + ambiyans (opsiyonel; yoksa özellik atlanır).
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          # Görsel anlatım katmanı (V2) — manuel run'da 'visual_fx' ile açılır; cron'da kapalı.
          VISUAL_STORYTELLING: ${{ inputs.visual_fx && '1' || '0' }}
          # Görsel stil zorlaması (manuel run'da seçilir; cron'da sistem karar verir).
          VIDEO_STYLE: ${{ inputs.style == 'auto' && '' || inputs.style }}
          # İçerik formatı zorlaması (test için; auto = rastgele rotasyon).
          FORCE_FORMAT: ${{ inputs.format == 'auto' && '' || inputs.format }}
          # Instagram + Facebook cross-post (opsiyonel; bkz. docs/meta-setup.md).
          # Tek zorunlu secret: META_USER_TOKEN. Sayfa + IG otomatik keşfedilir.
          META_USER_TOKEN: ${{ secrets.META_USER_TOKEN }}
          META_IG_LOGIN_TOKEN: ${{ secrets.META_IG_LOGIN_TOKEN }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ vars.META_PAGE_ID }}
          META_IG_USER_ID: ${{ vars.META_IG_USER_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # İlk çalıştırmalar için güvenli varsayılan: unlisted. Public için
          # Actions → Variables sekmesinden YOUTUBE_PRIVACY=public ekle.
          YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY || 'unlisted' }}
          TTS_VOICE: ${{ vars.TTS_VOICE }}
          # Bildirim (opsiyonel): Telegram botu ve/veya Discord webhook'u.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      # GÖZLEM (yalnızca okuma): kalıcı kayıtlar (videos.json + qc-history) yazıldıktan
      # SONRA rollout raporu üret. Render/motion/upload'a DOKUNMAZ; hata toleranslı —
      # rapor/log başarısızlığı job'ı ASLA düşürmez. Üretim adımı çalıştıysa çalışır
      # (produce skip edilmediyse); iptal edildiyse çalışmaz.
      # FINAL MP4 DENETİMİ — plana değil, çıkan videoya bakar. Boru hattı içinde
      # de koşuyor (publish gate'in birincil girdisi); bu adım aynı denetimi
      # artifact'ten bağımsız olarak log'a döker ki insan gözüyle okunabilsin.
      - name: Final MP4 denetimi (kare taraması)
        if: ${{ !cancelled() && steps.produce.conclusion != 'skipped' }}
        run: |
          V=$(find output -name '*.mp4' -not -name 'fullv.mp4' | head -1)
          G=$(find output -name 'publish-gates.json' | head -1)
          if [ -n "$V" ]; then
            node scripts/audit-final-video.js "$V" ${G:+"$G"} --fps 2 || echo "[final-video] DENETİM BAŞARISIZ (yayın engelli)"
          else
            echo "[final-video] mp4 bulunamadı"
          fi

      - name: Motion rollout raporu (gözlem)
        if: ${{ !cancelled() && steps.produce.conclusion != 'skipped' }}
        run: |
          npm run motion:rollout-report || echo "[motion-rollout] report generation failed; production continues"
          node scripts/motion-rollout-log.js || echo "[motion-rollout] log helper failed; production continues"

      - name: Motion rollout raporunu artifact olarak sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-rollout-report-${{ github.run_number }}
          path: |
            artifacts/motion/rollout/rollout-report.json
            artifacts/motion/rollout/rollout-report.md
          if-no-files-found: ignore
          retention-days: 14

      - name: Üretilen videoyu artifact olarak sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-video
          path: |
            output/**/*.mp4
            output/**/cover.jpg
            output/**/preview-*.jpg
            output/**/publish-kit.txt
            output/**/report.json
            output/**/production-report.json
            output/**/production-report.md
            output/**/publish-gates.json
            output/**/asset-manifest.json
            output/**/script.json
            output/**/scene-plan.json
            output/**/subs.srt
          if-no-files-found: ignore
          retention-days: 7

      # Konu/yayın tekrarını önlemek için üretilen state'i branch'e geri yaz.
      # Firebase yoksa yayın defteri de bu JSON state ile kalıcılaşır.
      - name: Dedup state'ini kalıcı yap
        if: always()
        run: |
          git config user.name "neosaniye-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/used_topics.json data/videos.json data/qc-history.jsonl data/publishing-attempts.json || true
          if git diff --cached --quiet; then
            echo "state değişmedi, commit yok"
          else
            git commit -m "chore(state): used_topics/videos güncelle [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi
