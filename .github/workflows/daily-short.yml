name: NeoSaniye Remotion — Günlük Short

on:
  workflow_dispatch:
    inputs:
      auto_upload:
        description: "YouTube/Meta'ya yükle (manuel çalıştırmada varsayılan kapalı)"
        type: boolean
        default: false
      style:
        description: "Kaynak görsel stili"
        type: choice
        options: [auto, animated, photo]
        default: auto
      format:
        description: "İçerik formatı"
        type: choice
        options: [auto, process, story, howworks, facts3, whatif]
        default: auto
      slot:
        description: "Deney slotu"
        type: choice
        options: [manual, "13:00", "18:00", "23:00"]
        default: manual
  schedule:
    - cron: "2 13 * * *"
    - cron: "2 18 * * *"
    - cron: "2 23 * * *"

concurrency:
  group: neosaniye-remotion-production
  cancel-in-progress: false

permissions:
  contents: write
  models: read

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and ffprobe
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install pipeline dependencies
        run: npm ci

      - name: Install Remotion renderer
        run: npm install --prefix remotion --no-audit --no-fund

      - name: Install TTS tools
        run: pip install -r requirements.txt

      - name: Validate Remotion-only architecture
        run: |
          npm run test:remotion
          npm run remotion:typecheck

      - name: Produce and publish
        id: produce
        run: node scripts/generate-and-publish.js ${{ (github.event_name == 'schedule' || inputs.auto_upload) && '--upload' || '--no-upload' }}
        env:
          CONTENT_LANGUAGE: en
          REMOTION_CONCURRENCY: ${{ vars.REMOTION_CONCURRENCY || '2' }}

          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: openrouter/free
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}

          AUTO_UPLOAD: ${{ (github.event_name == 'schedule' || inputs.auto_upload) && 'true' || 'false' }}
          REQUIRE_MANUAL_APPROVAL: "false"
          RETENTION_QC_MODE: ${{ vars.RETENTION_QC_MODE || 'warning' }}
          RETENTION_MIN_SCORE: ${{ vars.RETENTION_MIN_SCORE || '75' }}
          TECHNICAL_PREFLIGHT_MODE: ${{ vars.TECHNICAL_PREFLIGHT_MODE || 'strict' }}
          SCHEDULE_SLOT: ${{ inputs.slot }}
          VIDEO_STYLE: ${{ inputs.style == 'auto' && '' || inputs.style }}
          FORCE_FORMAT: ${{ inputs.format == 'auto' && '' || inputs.format }}

          META_USER_TOKEN: ${{ secrets.META_USER_TOKEN }}
          META_IG_LOGIN_TOKEN: ${{ secrets.META_IG_LOGIN_TOKEN }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ vars.META_PAGE_ID }}
          META_IG_USER_ID: ${{ vars.META_IG_USER_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY || 'unlisted' }}
          TTS_VOICE: ${{ vars.TTS_VOICE || 'en-US-AndrewNeural' }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Audit final MP4
        if: ${{ success() }}
        run: |
          V=$(find output -maxdepth 2 -name '*.mp4' -not -path '*/media/*' -not -name 'fullv.mp4' | head -1)
          G=$(find output -name 'publish-gates.json' | head -1)
          if [ -n "$V" ]; then
            node scripts/audit-final-video.js "$V" ${G:+"$G"} --fps 2
            ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,channels -show_entries format=duration -of json "$V"
          else
            echo "Final MP4 bulunamadı"
            exit 1
          fi

      - name: Upload production artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neosaniye-remotion-short-${{ github.run_number }}
          path: |
            output/**/*.mp4
            output/**/production.json
            output/**/cover.jpg
            output/**/preview-*.jpg
            output/**/publish-kit.txt
            output/**/report.json
            output/**/production-report.json
            output/**/production-report.md
            output/**/publish-gates.json
            output/**/asset-manifest.json
            output/**/script.json
            output/**/scene-plan.json
            output/**/subs.srt
          if-no-files-found: warn
          retention-days: 7

      - name: Persist dedup state
        if: always()
        run: |
          git config user.name "neosaniye-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/used_topics.json data/videos.json data/qc-history.jsonl data/publishing-attempts.json || true
          if git diff --cached --quiet; then
            echo "state değişmedi, commit yok"
          else
            git commit -m "chore(state): üretim durumunu güncelle [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi
