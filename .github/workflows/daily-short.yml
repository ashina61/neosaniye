name: Daily short

# Runs only when you start it. Upload defaults to off, so the whole chain can be
# exercised against the real APIs without posting anything; set it to `all` in
# the form when you want the video published.

on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Where to publish'
        type: choice
        default: 'none'
        options: ['none', 'youtube', 'all']
      privacy:
        description: 'YouTube privacy'
        type: choice
        default: 'unlisted'
        options: ['unlisted', 'public', 'private']
      topic:
        description: 'Any question, or a topics.yaml id. Blank = next in the queue'
        type: string
        default: ''
      mechanism:
        description: 'Optional: the one-sentence truth the script must not contradict'
        type: string
        default: ''
      duration:
        description: 'Seconds'
        type: choice
        default: '40'
        options: ['30', '40', '50', '60', '75', '90']
      voice:
        # auto walks the ladder Gemini -> Kokoro -> piper. Picking kokoro skips
        # Gemini entirely: no quota to run out of, and because it reads at about
        # 3.0 words a second against Gemini's 1.9 the script it gets is half
        # again longer for the same running time.
        description: 'Narration voice'
        type: choice
        default: 'auto'
        options: ['auto', 'kokoro', 'piper']

  # A scheduled run carries NO inputs at all, so every `inputs.x` below is
  # empty for it and the `|| default` fallbacks are what actually configure it.
  # Forgetting that on the Publish step is not a loud failure: the run makes a
  # video, publishes nothing, and reports success.
  schedule:
    - cron: '0 4 * * *'    # 07:00 Istanbul
    - cron: '0 15 * * *'   # 18:00 Istanbul

concurrency:
  group: daily-short          # two runs must never draw from the queue at once
  cancel-in-progress: false

permissions:
  contents: write             # commit the spec, state and deliverable; cut a release

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: System packages
        run: |
          sudo apt-get update -qq
          # pango and cairo are what Manim's text and vector rendering sit on;
          # without them manimpango falls back to building from source and fails
          sudo apt-get install -y -qq ffmpeg libcairo2-dev libpango1.0-dev pkg-config
          ffmpeg -version | head -1

      - name: Python dependencies
        run: pip install --quiet pyyaml numpy requests piper-tts fonttools brotli kokoro-onnx soundfile

      # Manim draws the animated mechanism scenes. It is deliberately a separate,
      # non-fatal step: it is the heaviest install in the job, and the pipeline
      # already falls back to a static scene when it is missing, so a bad day on
      # PyPI should cost a nicer frame, not the whole video.
      - name: Manim (optional)
        continue-on-error: true
        run: |
          pip install --quiet manim
          python -c "import manim; print('manim', manim.__version__)"

      # Access to Gemini's TTS preview models is not implied by a working key —
      # they can refuse on the first call. Without a local voice the run would
      # have nowhere to fall back to, so the model is cached and always present.
      # Both local voices live under .voices, so one cache covers them. Kokoro
      # is ~350MB and would otherwise be re-downloaded on every single run.
      - name: Cache the local narration voices
        id: voice
        uses: actions/cache@v4
        with:
          path: .voices
          key: voices-piper-ryan-high-kokoro-v1.0

      - name: Fetch the local narration voices
        if: steps.voice.outputs.cache-hit != 'true'
        run: |
          mkdir -p .voices/kokoro
          curl -sL --max-time 600 -o /tmp/voice.tar.gz \
            https://github.com/rhasspy/piper/releases/download/v0.0.2/voice-en-us-ryan-high.tar.gz
          tar xzf /tmp/voice.tar.gz -C .voices && rm -f /tmp/voice.tar.gz
          # Kokoro is the middle voice: better than piper, and unlike Gemini it
          # has no quota to run out of. A failure here is not fatal — the
          # pipeline drops to piper — so this step does not stop the run.
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -sL --fail --max-time 900 -o .voices/kokoro/kokoro-v1.0.onnx \
            "$base/kokoro-v1.0.onnx" || echo "kokoro model unavailable; piper will cover"
          curl -sL --fail --max-time 300 -o .voices/kokoro/voices-v1.0.bin \
            "$base/voices-v1.0.bin" || echo "kokoro voices unavailable; piper will cover"
          ls -la .voices .voices/kokoro

      - name: Node dependencies
        run: cd daily && npm install --no-audit --no-fund --silent

      - name: Resolve a browser for the renderer
        run: |
          for c in /usr/bin/google-chrome /usr/bin/chromium-browser /usr/bin/chromium; do
            if [ -x "$c" ]; then echo "HYPERFRAMES_BROWSER_PATH=$c" >> "$GITHUB_ENV"; break; fi
          done
          if ! grep -q HYPERFRAMES_BROWSER_PATH "$GITHUB_ENV" 2>/dev/null; then
            npx --yes hyperframes browser ensure
          fi
          echo "HYPERFRAMES_SKIP_SKILLS=1" >> "$GITHUB_ENV"

      - name: Fonts
        run: python daily/lib/fetch_fonts.py

      - name: Pick a topic and write the spec
        id: spec
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # The script is budgeted for whichever voice will read it, so the
          # spec step has to see the same choice the build step gets.
          # A scheduled run gets kokoro rather than auto on purpose: auto
          # budgets the script for Gemini's 1.9 words a second and then, when
          # the quota refuses, has Kokoro read that thin script anyway. Going
          # straight to Kokoro touches no quota and carries a third more words.
          TTS_ENGINE: ${{ inputs.voice || 'kokoro' }}
          TOPIC: ${{ inputs.topic }}
          MECHANISM: ${{ inputs.mechanism }}
          DURATION: ${{ inputs.duration || '40' }}
        run: |
          set -euo pipefail
          # --topic takes a question or a topics.yaml id; write_spec prefers a
          # hand-written mechanism when the text names a known row.
          python daily/lib/write_spec.py \
            ${TOPIC:+--topic "$TOPIC"} ${MECHANISM:+--mechanism "$MECHANISM"} \
            --duration "$DURATION" | tee /tmp/spec.log
          SPEC=$(tail -1 /tmp/spec.log)
          echo "path=$SPEC" >> "$GITHUB_OUTPUT"
          echo "slug=$(basename "$SPEC" .yaml)" >> "$GITHUB_OUTPUT"

      - name: Build the video
        env:
          # Narration asks Gemini once for the whole script and cuts the take
          # locally, so a video costs one request rather than ten. That may fit
          # the free tier where per-beat calls did not; if it refuses, the run
          # falls back to the local voice and still produces a video.
          TTS_ENGINE: ${{ inputs.voice || 'kokoro' }}
          GEMINI_API_KEY:  ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY:  ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python daily/lib/build.py "${{ steps.spec.outputs.path }}"

      - name: Contact sheet
        run: python daily/lib/contact_sheet.py "out/${{ steps.spec.outputs.slug }}"

      - uses: actions/upload-artifact@v4
        with:
          name: review-${{ steps.spec.outputs.slug }}
          path: |
            out/${{ steps.spec.outputs.slug }}/contact-sheet.jpg
            out/${{ steps.spec.outputs.slug }}/*_1080x1920.mp4
            ${{ steps.spec.outputs.path }}
          retention-days: 14

      - name: Publish
        env:
          GITHUB_TOKEN:          ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          META_USER_TOKEN:       ${{ secrets.META_USER_TOKEN }}
        run: |
          set -euo pipefail
          # A run you start yourself uses the form, which defaults to
          # upload:none so looking at a result does not publish it. A scheduled
          # run has no form, and these fallbacks are its whole configuration:
          # publish everywhere, publicly.
          UPLOAD='${{ inputs.upload || 'all' }}'
          PRIVACY='${{ inputs.privacy || 'public' }}'
          python daily/lib/publish.py \
            "out/${{ steps.spec.outputs.slug }}" \
            --spec "${{ steps.spec.outputs.path }}" \
            --upload "$UPLOAD" --privacy "$PRIVACY"

      - name: Record and commit
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys; sys.path.insert(0, 'daily/lib')
          import topics_queue
          topics_queue.mark("${{ steps.spec.outputs.slug }}", run="${{ github.run_id }}")
          PY
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # rates.json is how the pipeline remembers how fast each voice
          # actually talks; without committing it every run starts from the seed
          git add daily/specs daily/state.json daily/rates.json videos || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Daily short: ${{ steps.spec.outputs.slug }}"
            git pull --rebase --autostash origin "${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
          fi
