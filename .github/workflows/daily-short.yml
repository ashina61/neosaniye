name: Günlük Short Üret ve Yayınla

# Manuel tetikleme her zaman açık; cron ile günlük otomatik üretim AKTİF.
on:
  workflow_dispatch:
    inputs:
      no_upload:
        description: "YouTube upload'ı atla (sadece üret)"
        type: boolean
        default: false
      style:
        description: "Görsel stil (auto = sistem karar verir)"
        type: choice
        options: [auto, animated, photo]
        default: auto
  schedule:
    - cron: "0 15 * * *" # her gün 15:00 UTC (TR 18:00) — otomatik üretim
    # - cron: "0 21 * * *" # günde 2. üretim istenirse bu satırı aç

concurrency:
  group: daily-short
  cancel-in-progress: false

permissions:
  contents: write # dedup state'ini (data/*.json) branch'e geri commit edebilmek için

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: ffmpeg kur
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python TTS araçları
        run: pip install -r requirements.txt

      - name: Node bağımlılıkları
        run: npm ci

      - name: Telifsiz müzik indir (opsiyonel, best-effort)
        run: node scripts/fetch-music.js || true
        env:
          MUSIC_URLS: ${{ vars.MUSIC_URLS }}

      - name: Üret ve yayınla
        run: node scripts/generate-and-publish.js ${{ inputs.no_upload && '--no-upload' || '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # İkinci stok kaynağı + ambiyans (opsiyonel; yoksa özellik atlanır).
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          # Görsel stil zorlaması (manuel run'da seçilir; cron'da sistem karar verir).
          VIDEO_STYLE: ${{ inputs.style == 'auto' && '' || inputs.style }}
          # Instagram + Facebook cross-post (opsiyonel; bkz. docs/meta-setup.md).
          # Tek zorunlu secret: META_USER_TOKEN. Sayfa + IG otomatik keşfedilir.
          META_USER_TOKEN: ${{ secrets.META_USER_TOKEN }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ vars.META_PAGE_ID }}
          META_IG_USER_ID: ${{ vars.META_IG_USER_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # İlk çalıştırmalar için güvenli varsayılan: unlisted. Public için
          # Actions → Variables sekmesinden YOUTUBE_PRIVACY=public ekle.
          YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY || 'unlisted' }}
          TTS_VOICE: ${{ vars.TTS_VOICE }}
          # Bildirim (opsiyonel): Telegram botu ve/veya Discord webhook'u.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Üretilen videoyu artifact olarak sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-video
          path: |
            output/**/*.mp4
            output/**/publish-kit.txt
            output/**/report.json
            output/**/preview-*.jpg
          if-no-files-found: ignore
          retention-days: 7

      # Konu tekrarını önlemek için üretilen state'i branch'e geri yaz.
      # (Firebase yoksa dedup yalnızca böyle kalıcı olur.)
      - name: Dedup state'ini kalıcı yap
        if: always()
        run: |
          git config user.name "neosaniye-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/used_topics.json data/videos.json || true
          if git diff --cached --quiet; then
            echo "state değişmedi, commit yok"
          else
            git commit -m "chore(state): used_topics/videos güncelle [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi
