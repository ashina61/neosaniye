name: Publish the next one in the queue

# Two videos a day — morning and evening — with nobody in the loop.
#
# It reads productions/QUEUE.yaml, takes the FIRST entry whose state is
# `pending`, publishes it exactly as that entry says, and commits the state back
# so the next run takes the next one.
#
# THE THINGS THAT MAKE THIS SAFE TO LEAVE RUNNING, and every one of them is
# here because the generator this repository retired did the opposite:
#
#  1. The queue has a master switch. `enabled: false` and this job does nothing
#     at all. A merge of this workflow does not start publishing anything.
#  2. NOTHING FALLS BACK. Each entry states its own `upload` and `privacy`, and
#     bin/queue.py skips any entry that does not. A scheduled run carries no
#     inputs, so `inputs.x || default` is how a pipeline ends up publishing
#     everywhere, publicly, without anyone choosing that.
#  3. No model runs in this job and no model-written code is executed. The
#     runner holds the upload tokens; the only thing it is trusted to do is move
#     a file that is already committed and already watched.
#  4. The file is proved to be 1080x1920 with an audio track before it goes
#     near an account, and the COPY is checked with it: the first eight went up
#     with 1800-character descriptions and one visible hashtag, which is a wall
#     of text and, in practice, no tags. bin/check-copy.py fails the job rather
#     than putting another one up.
#  5. It publishes ONE and stops. A bad video costs one slot, not the queue.
#  5b. IT ASKS THE QUEUE WHETHER ANYTHING IS DUE, not the clock. Two runs inside
#     one slot publish one video, because bin/queue.py measures the gap from the
#     last `published_at` and hands out nothing inside `min_hours_between`. See
#     the note under `on:` for the day that made this necessary.
#  6. It PROVES the upload happened before ticking the entry off.
#     daily/lib/publish.py always returns 0 — it catches every upload failure,
#     records it as `failed:`/`skipped:` and exits cleanly, because it is built
#     to publish to several places and not lose the ones that worked. Fine for
#     it, fatal for a queue: a dead token would tick the video off, move on next
#     week, and drop it in silence. bin/confirm-publish.py reads published.json
#     and fails the job unless every destination came back with a real URL.
#
# WHICH BRANCH THIS READS. A `schedule:` trigger only ever fires from the
# repository's DEFAULT branch, so this FILE has to live on main — but the queue
# it reads, the productions it publishes and the tick-off it writes back all
# live on the production branch, which is where the daily producer pushes. So
# the job checks out BRANCH below explicitly rather than trusting the ref it
# was started from. Main is a mirror: the producer fast-forwards it after every
# run, which is also how a change to this file reaches the scheduler.

# A GITHUB CRON IS NOT A CLOCK, IT IS A QUEUE POSITION. It can run hours late.
# This one is set for 15:00 UTC on Sundays; on 2026-09-06 it fired at 17:27 —
# two hours and twenty-seven minutes late — and by then a manual run at 17:25
# had already published that week's video. The late cron took the next
# `pending` and published that too: two videos, two minutes apart. Both runs
# did exactly what they were told, which is the point. A schedule you cannot
# predict cannot also be the thing that decides what is due.
#
# So the queue decides. bin/queue.py compares now against the newest
# `published_at` in QUEUE.yaml and prints an empty slug inside
# `min_hours_between` (8), whatever started the run. A late cron lands on
# "nothing is due" instead of on the next video, and this job is safe to start
# by hand at any time. `force: true` is the deliberate override.
#
# THE TWO SLOTS ARE 11 AND 13 HOURS APART, which is what makes an 8 hour gap
# both honest and strict: every real slot passes, and a cron would have to be
# eight hours late to reach the next one. If a slot ever passes with no run,
# nothing is lost — the entry stays `pending` and the next slot takes it.
on:
  schedule:
    - cron: '0 6 * * *'         # 09:00 Europe/Istanbul — the morning one
    - cron: '0 17 * * *'        # 20:00 Europe/Istanbul — the evening one
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Say what it would do, and do nothing'
        type: boolean
        default: true
      force:
        description: 'Publish even if the last one went out less than min_hours_between ago'
        type: boolean
        default: false

concurrency:
  group: publish-production     # never at the same time as a manual publish
  cancel-in-progress: false

permissions:
  contents: write               # the release, and the state written back

env:
  BRANCH: claude/openmontage-setup-dh10g0   # where the queue and the films live

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0        # the tick-off step rebases; a shallow clone cannot

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - run: pip install --quiet pyyaml requests

      - name: What is in the queue
        run: python bin/queue.py status

      - name: Take the next one
        id: q
        run: |
          python bin/queue.py next ${{ inputs.force && '--force' || '' }} >> "$GITHUB_OUTPUT"

      - name: Nothing to do
        if: steps.q.outputs.slug == ''
        run: |
          echo "Nothing is due — the queue is off or empty, the next entry is not"
          echo "publishable, or one went out too recently. The step above says which."

      - name: Check the file
        if: steps.q.outputs.slug != ''
        id: prod
        run: |
          set -euo pipefail
          DIR="productions/${{ steps.q.outputs.slug }}"
          test -f "$DIR/spec.yaml" || { echo "missing $DIR/spec.yaml"; exit 1; }
          VIDEO=$(ls "$DIR"/*_1080x1920.mp4 2>/dev/null | head -1)
          test -n "$VIDEO" || { echo "no *_1080x1920.mp4 in $DIR"; exit 1; }
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          W=$(ffprobe -v error -select_streams v:0 -show_entries stream=width  -of csv=p=0 "$VIDEO")
          H=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$VIDEO")
          test "$W" = "1080" && test "$H" = "1920" || { echo "not 1080x1920: ${W}x${H}"; exit 1; }
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$VIDEO" \
            | grep -q . || { echo "no audio track"; exit 1; }
          # The house length is 40-50s and bin/build-ink.sh enforces it at build
          # time. Here it is only reported: three films were finished and queued
          # before that gate existed and run 56-62s, and blocking them would take
          # the channel off the air to fix a ten second overrun.
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$VIDEO")
          awk -v d="$D" 'BEGIN {
            if (d > 180) { print "FAIL: " d "s is over the Shorts limit"; exit 1 }
            printf "  length %.1fs%s\n", d,
              (d >= 40 && d <= 50) ? "" : "   <- outside the 40-50s house range" }'
          python bin/check-copy.py "$DIR/spec.yaml"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "OK: $VIDEO  ->  ${{ steps.q.outputs.upload }} / ${{ steps.q.outputs.privacy }}"

      - name: Dry run stops here
        if: steps.q.outputs.slug != '' && inputs.dry_run
        run: echo "dry_run — ${{ steps.q.outputs.slug }} would go to ${{ steps.q.outputs.upload }} as ${{ steps.q.outputs.privacy }}. Nothing was published."

      - name: Publish
        if: steps.q.outputs.slug != '' && !inputs.dry_run
        env:
          GITHUB_TOKEN:          ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          META_USER_TOKEN:       ${{ secrets.META_USER_TOKEN }}
        run: |
          set -euo pipefail
          python daily/lib/publish.py \
            "${{ steps.prod.outputs.dir }}" \
            --spec "${{ steps.prod.outputs.dir }}/spec.yaml" \
            --upload '${{ steps.q.outputs.upload }}' \
            --privacy '${{ steps.q.outputs.privacy }}' \
            --dest "videos/${{ steps.q.outputs.slug }}"

      # publish.py exits 0 whatever happened, so ask the bundle it wrote instead.
      # THIS STEP FAILING IS THE WHOLE SAFETY NET: the entry stays `pending` and
      # next week tries the same video rather than skipping it in silence.
      - name: Did it actually go up
        id: confirm
        if: steps.q.outputs.slug != '' && !inputs.dry_run
        run: |
          python bin/confirm-publish.py \
            "videos/${{ steps.q.outputs.slug }}/published.json" \
            "${{ steps.q.outputs.upload }}" >> "$GITHUB_OUTPUT"

      - name: Tick it off
        if: success() && steps.q.outputs.slug != '' && !inputs.dry_run
        run: |
          set -euo pipefail
          python bin/queue.py done "${{ steps.q.outputs.slug }}" --url "${{ steps.confirm.outputs.url }}"
          git config user.name  "openmontage-queue"
          git config user.email "openmontage-queue@users.noreply.github.com"
          git add productions/QUEUE.yaml
          git commit -m "Published ${{ steps.q.outputs.slug }}" || exit 0
          git pull --rebase --autostash origin "$BRANCH"
          git push origin "HEAD:$BRANCH"

      - uses: actions/upload-artifact@v4
        if: steps.q.outputs.slug != '' && !inputs.dry_run
        with:
          name: bundle-${{ steps.q.outputs.slug }}
          path: videos/${{ steps.q.outputs.slug }}
          retention-days: 14
