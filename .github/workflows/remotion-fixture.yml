name: Remotion Production Engine Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [claude/youtube-shorts-automation-9dbrjx]

permissions:
  contents: read

concurrency:
  group: remotion-fixture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-remotion:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install main pipeline dependencies
        run: npm ci

      - name: Install isolated Remotion dependencies
        run: npm install --prefix remotion --no-audit --no-fund

      - name: Install fixture TTS
        run: python -m pip install --disable-pip-version-check edge-tts==7.2.7

      - name: Generate English fixture voice music and layered SFX
        run: |
          python scripts/generate-remotion-fixture-audio.py
          if [ -f remotion/public/runs/fixture/voice.mp3 ]; then
            ffmpeg -y -v error -i remotion/public/runs/fixture/voice.mp3 \
              -ar 22050 -ac 1 remotion/public/runs/fixture/voice.wav
          fi
          test -s remotion/public/runs/fixture/voice.wav
          test -s remotion/public/runs/fixture/music.wav
          test -s remotion/public/runs/fixture/whoosh.wav
          test -s remotion/public/runs/fixture/boom.wav

      - name: Test production spec compiler
        run: node --test test/remotionSpec.test.js

      - name: Typecheck Remotion engine
        run: npm run remotion:typecheck

      - name: Render dynamic collage fixture
        run: |
          mkdir -p artifacts
          npm run remotion:fixture

      - name: Validate final MP4 streams
        run: |
          ffprobe -v error \
            -show_entries stream=codec_name,width,height,r_frame_rate,channels \
            -show_entries format=duration \
            -of json artifacts/remotion-fixture.mp4 | tee artifacts/remotion-fixture-ffprobe.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('artifacts/remotion-fixture-ffprobe.json').read_text())
          streams = data.get('streams', [])
          video = next((s for s in streams if s.get('width')), None)
          audio = next((s for s in streams if s.get('channels')), None)
          duration = float(data.get('format', {}).get('duration', 0))
          assert video, 'video stream missing'
          assert audio, 'audio stream missing'
          assert video.get('codec_name') == 'h264', video
          assert (video.get('width'), video.get('height')) == (1080, 1920), video
          assert 23.5 <= duration <= 24.5, duration
          print(f'validated duration={duration:.3f}s video={video} audio={audio}')
          PY

      - name: Scan black freeze and silence windows
        run: |
          ffmpeg -hide_banner -i artifacts/remotion-fixture.mp4 \
            -vf "blackdetect=d=0.8:pix_th=0.08,freezedetect=n=-50dB:d=3" \
            -af "silencedetect=n=-45dB:d=2.5" -f null - 2>&1 | tee artifacts/remotion-fixture-scan.log
          if grep -Eq "black_start|freeze_start|silence_start" artifacts/remotion-fixture-scan.log; then
            echo "Unexpected black/freeze/silence window detected"
            exit 1
          fi

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: neosaniye-remotion-production-fixture
          path: |
            artifacts/remotion-fixture.mp4
            artifacts/remotion-fixture-ffprobe.json
            artifacts/remotion-fixture-scan.log
            fixtures/remotion/production.json
          if-no-files-found: error
          retention-days: 7
