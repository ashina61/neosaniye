name: Render Short — Manual Only, No Upload

# MANUEL. Cron yok, push tetikleyicisi yok, upload yok.
#
# Neden: AGENTS.md kuralı "workflow'lar kullanıcı açıkça istemedikçe yalnızca
# manuel olacak" ve "yayınlama/upload mantığı eklenmeyecek" diyor. Ayrıca eski
# repoda her push'ta 30 dakikalık render başlatan bir tetikleyici vardı ve
# arka arkaya 12 başarısız çalıştırmaya sebep olmuştu.

on:
  workflow_dispatch:
    inputs:
      composition:
        description: Which composition to render
        required: true
        default: Short
        type: choice
        options:
          - Short
          - StyleSheet

permissions:
  contents: read

concurrency:
  group: neosaniye-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Python ve ffmpeg AÇIKÇA kurulur. Doğrulayıcı ikisini de kullanıyor
      # (numpy/PIL ile ölçüm, ffprobe/ffmpeg ile kare çıkarma) ve runner
      # imajının bunları taşıdığına güvenmek sessiz çökmeye yol açtı.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          # DİKKAT: `python -m pip` ile kurup `python3` ile çalıştırmak,
          # ikisi farklı yorumlayıcıya çözülürse import hatası verir ve iş
          # 1 saniyede çöker. Aynı yorumlayıcı kullanılmak zorunda.
          python3 -m pip install --disable-pip-version-check --quiet pillow numpy

      # TARAYICI: Remotion KENDİ Chrome Headless Shell'ini indirir ve kullanır.
      #
      # Burada önce `/usr/bin/google-chrome`u bulup REMOTION_BROWSER ile
      # gösteren bir adım vardı; ~150 MB indirmeyi atlatmak içindi. ÖLÇÜLDÜ ki
      # o tarayıcı filtreli katmanların HEPSİNİ sessizce düşürüyor: 19 sahnenin
      # 14'ü boş çıktı (yalnızca zemin + doku), dosya 25 MB yerine 7 MB oldu,
      # ve render adımı "başarılı" dedi.
      #
      # Yerelde aynı kompozisyon headless_shell ile kusursuz render ediliyor.
      # Remotion'ın desteklediği yapılandırma bu; indirmeyi atlamak uğruna
      # test edilmemiş bir tarayıcıya geçmek yanlıştı.
      - name: Build storyboard from story.json
        run: npm run beats

      # Cutout üretimi BURADA çalışır, yerel geliştirme ortamında değil:
      # sağlayıcı anahtarları repo secret'ı ve geliştirme konteynerinin ağ
      # politikası image.pollinations.ai / api.together.xyz /
      # generativelanguage.googleapis.com hostlarını 403'lüyor.
      #
      # Başarısız olursa iş DURMAZ: cutout üretilemeyen sahneler prosedürel
      # siluetle render edilir ve video yine çıkar.
      - name: Generate halftone cutouts (alpha PNG)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          IMAGE_PROVIDER_CHAIN: ${{ vars.IMAGE_PROVIDER_CHAIN || 'pollinations,together,gemini' }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL || 'gemini-3.1-flash-image' }}
        run: npm run cutouts -- --live

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Render
        run: |
          npx remotion render src/index.ts "${{ inputs.composition }}" \
            "out/${{ inputs.composition }}.mp4" \
            --codec=h264 --crf=18 --pixel-format=yuv420p

      - name: Verify render against reference measurements
        if: inputs.composition == 'Short'
        run: python3 pipeline/verify-render.py "out/Short.mp4" content/storyboard.json

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neosaniye-${{ inputs.composition }}-${{ github.run_number }}
          path: |
            out/*.mp4
            content/storyboard.json
            public/cutouts/*.png
          if-no-files-found: warn
          retention-days: 7
