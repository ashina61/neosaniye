name: Remotion Check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - claude/youtube-shorts-automation-9dbrjx

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Render test video
        run: npm run render

      - name: Upload test video
        uses: actions/upload-artifact@v4
        with:
          name: neosaniye-remotion-test
          path: out/neosaniye-short.mp4
          if-no-files-found: error
          retention-days: 7
