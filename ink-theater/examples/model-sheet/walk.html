<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Eight frames of one stride, big, so the walk can be judged: the plant,
         the pass, the toe-off, and what the shoulders and hands do across it. -->
    <script src="gsap.min.js"></script>
    <script src="ink-theater.js"></script>
    <script src="ink-puppet.js"></script>
    <script src="ink-figure.js"></script>
    <script src="clips.js"></script>
    <style>
      * { margin: 0; padding: 0; }
      @font-face { font-family: "InkHand"; src: url("assets/patrickhand.ttf") format("truetype"); }
      html, body { width: 2400px; height: 1100px; background: #FCFBF8; overflow: hidden; }
      #root { position: relative; width: 2400px; height: 1100px; }
      svg { position: absolute; inset: 0; width: 2400px; height: 1100px; }
      .lbl { position: absolute; font-family: "InkHand", cursive; font-size: 24px; color: #8A857A; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1"
         data-width="2400" data-height="1100" data-fps="30">
      <section class="clip" data-start="0" data-duration="1">
        <svg viewBox="0 0 2400 1100" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <filter id="boil" x="-20%" y="-20%" width="140%" height="140%">
              <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="1" seed="1" result="n"/>
              <feDisplacementMap in="SourceGraphic" in2="n" scale="2.0"/>
            </filter>
          </defs>
          <line id="groundline" x1="0" y1="940" x2="2400" y2="940" stroke="#C9C4B8" stroke-width="2"/>
          <g id="sheet"></g>
        </svg>
        <div id="labels"></div>
      </section>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var IP = window.InkPuppet, IF = window.InkFigure, NS = "http://www.w3.org/2000/svg";
      var sheet = document.getElementById("sheet"), labels = document.getElementById("labels");
      var GROUND = 940, SCALE = 1.42;
      var FRAMES = [0, 5, 10, 15, 20, 25, 30, 35];
      FRAMES.forEach(function (f, i) {
        var x = 190 + i * 280;
        var mount = document.createElementNS(NS, "g");
        sheet.appendChild(mount);
        var scaleG = document.createElementNS(NS, "g");
        mount.parentNode.insertBefore(scaleG, mount); scaleG.appendChild(mount);
        scaleG.setAttribute("transform", "translate(" + x + "," + GROUND + ") scale(" + SCALE +
                            ") translate(" + (-x) + "," + (-GROUND) + ")");
        var pup = IP.create(mount, { cx: x, ground: GROUND, boil: "boil",
                                     headR: IF.ADEM.headR - 2, strokeWidth: 4 });
        var fig = IF.attach(pup, { unit: SCALE });
        IP.still("walk", f, "w" + f);
        IP.choreograph(tl, pup, [{ clip: "w" + f, dur: 1 }], { start: 0 });
        fig.group.setAttribute("opacity", 1);
        fig.pencil.forEach(function (p) { p.setAttribute("opacity", 0); });
        fig.redraw();
        var d = document.createElement("div");
        d.className = "lbl"; d.style.left = (x - 40) + "px"; d.style.top = (GROUND + 70) + "px";
        d.textContent = "frame " + f; labels.appendChild(d);
      });
      tl.progress(0.001);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
