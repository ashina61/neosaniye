# THE PUBLISH QUEUE
#
# `publish-queue.yml` reads this file, takes the FIRST entry whose state is
# `pending`, publishes it exactly as that entry says, and writes the state back
# to this file in a commit. TWO videos a day — morning and evening — with
# nobody in the loop.
#
# WHY EVERY ENTRY CARRIES ITS OWN SETTINGS. The generator this repository used
# to run is retired at the bottom of daily-short.yml, and the note there is the
# reason this file is shaped the way it is: a scheduled run carries no inputs,
# so `inputs.x || default` fallbacks become its whole configuration, and it
# quietly published everywhere, publicly, twice a day. Nothing here falls back
# to anything. If an entry does not say `upload` and `privacy`, it is skipped.
#
# THE MASTER SWITCH. Nothing is published while `enabled` is false. Turn it on
# when you have watched the first few and you are happy for them to go.

enabled: true

# 09:00 and 20:00 Europe/Istanbul, every day. The workflow's cron is the
# authority; this is here so the file says what it does.
schedule: "0 6,17 * * *   # 09:00 and 20:00 Europe/Istanbul, daily"

# THE GAP THAT MAKES A LATE CRON HARMLESS. On 2026-09-06 a manual run published
# at 17:25 and the week's cron — two and a half hours late, not skipped — fired
# at 17:27 and published the next one as well. Two videos, two minutes apart.
# Neither run was wrong; nothing was asking whether anything was actually due.
# `bin/queue.py next` compares now against the newest `published_at` below and
# hands out nothing inside this many hours, so any number of runs inside one
# slot still publish one video. `--force` overrides it.
#
# WHY 8. The two slots are 11 and 13 hours apart, so 8 leaves every honest slot
# through and still catches a cron up to 8 hours late — far beyond the 2h27m
# that caused the double. Raise it towards 10 to be stricter; do not raise it
# past 11 or the evening slot starts refusing itself.
min_hours_between: 8

# How many go out a day. Only `status` reads it, to say how many days of queue
# is left — the cron is what actually decides. It is here because two a day
# eats a queue twice as fast as the producer fills it, and the runway line is
# the thing that says so before the queue runs dry.
slots_per_day: 2

topics_used:
  # the eight already made — these ids must not come round again
  - noise-cancelling
  - tides-twice
  - benfords-law
  - doorway-effect
  - chronostasis
  - applause-sync
  - self-tickle
  - buttered-toast

