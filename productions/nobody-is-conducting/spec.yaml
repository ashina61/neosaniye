# Publish spec for a hand-produced short.
#
# Built as an atelier composition on the ink-sketch playbook, rendered by
# HyperFrames. The picture and the soundtrack are two readings of one array:
# source/sim/kuramoto.py integrates a globally coupled Kuramoto model of 120
# clapping hands, source/sim/mix.py synthesises every one of the 17,121 claps at
# the instant that model says it happened, and the composition draws every hand
# at the phase that model says it is at. See source/art-direction.md.
# This file exists only so daily/lib/publish.py can consume the folder.
