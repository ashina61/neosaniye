copy:
  title: "A bird sits on 11,000 volts. Nothing happens."
  hook: "It is not insulated and its feet are bare. It is fine because both feet are in the same place."
  caption: >-
    Voltage is not something you touch — it is a difference between two places.
    Both of the bird's feet are on one wire, so there is no difference between
    them and nothing flows. Draw it as height and the wire is flat. What kills
    the big birds is bridging two conductors at once: wingspan.
  description: |-
    A bird sits on 11,000 volts and nothing happens to it. It is not insulated.

    Voltage is a difference between two places, and both of its feet are in the same place. Draw it as height and the wire is flat — nothing rolls on flat ground. Touch a second conductor and a step appears under you, which is why big birds die where small birds sit.

