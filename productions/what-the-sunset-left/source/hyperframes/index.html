<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      WHAT THE SUNSET LEFT — why the sky is blue and the sunset is red, which
      are the same sentence read from two ends.

      DESIGN READ: ONE BEAM, AND THE ONLY VARIABLE IS HOW FAR IT HAS COME.
      The middle of this film is a single sunbeam crossing a band of air from
      left to right, made of individual photons. Blue ones get knocked out of
      it early; red ones mostly carry on. Nothing about the beam changes along
      its length except what is still in it -- so the picture does not need a
      round Earth, a second diagram or a comparison: it needs two marks on the
      same line. "noon" near the start, where there is still blue to lose, and
      "sunset" at the far end, where there is not.

      SIGNATURE DEVICE: THE BLUE THAT LEFT. Every blue photon that peels out of
      the beam keeps going, off into the page, and those are what the sky is.
      By the sunset mark the beam is red because all of its blue is somewhere
      above somebody else -- which is the last line of the script, drawn about
      twenty seconds before it is said.

      MOTION CHARACTER: TRAFFIC. Nothing in this film eases or springs. A
      hundred and fifty photons launch on a fixed schedule and travel at one
      constant speed for the whole film, and the only thing that ever happens
      to one is that it turns once and leaves. The diagram is never still,
      because light is not.

      PALETTE: two, and they are the subject rather than decoration. The house
      rule is one accent and this film breaks it on purpose -- blue #2F6FA8 is
      short wavelengths and warm #C8562B is long ones, and neither appears on
      anything that is not light. The sky over Adem is drawn as blue specks:
      the sky IS scattered light, so it is drawn out of the same dots.
    -->
    <script src="gsap.min.js"></script>
    <script src="ink-theater.js"></script>
    <script src="ink-puppet.js"></script>
    <script src="ink-figure.js"></script>
    <script src="clips.js"></script>
    <script src="brand.js"></script>
    <script src="annotate.js"></script>
    <script src="events.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      @font-face { font-family: "InkHand"; src: url("assets/patrickhand.ttf") format("truetype"); font-display: block; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #FCFBF8; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .stage { position: absolute; inset: 0; background: #FCFBF8; }
      .stage svg { position: absolute; inset: 0; display: block; width: 1080px; height: 1920px; }
      #overlay { position: absolute; inset: 0; }
      .cap { position: absolute; left: 56px; width: 968px; top: 1250px; text-align: center;
             font-family: "InkHand", cursive; font-size: 62px; line-height: 1.16; color: #333333; opacity: 0; }
      .cap b { font-weight: normal; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="47.60"
         data-width="1080" data-height="1920" data-fps="30">
      <section id="scene" class="clip" data-start="0" data-duration="47.60">
        <div class="stage">
          <svg viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <filter id="boil" x="-20%" y="-20%" width="140%" height="140%">
                <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="1" seed="1" result="n"/>
                <feDisplacementMap in="SourceGraphic" in2="n" scale="2.0"/>
              </filter>
            </defs>
            <g id="camera">
              <g id="sky" filter="url(#boil)"></g>
              <g id="actorScale"><g id="actorFace"><g id="actorMount"></g></g></g>
              <g id="beam"></g>
              <g id="notes"></g>
            </g>
            <g id="brandLayer"></g>
          </svg>
          <div id="overlay"></div>
        </div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var IT = window.InkTheater, IP = window.InkPuppet, IF = window.InkFigure;
      var IA = window.InkAnnotate;
      var tl = gsap.timeline({ paused: true });
      var NS = "http://www.w3.org/2000/svg";
      if (document.fonts && document.fonts.load) { document.fonts.load("62px InkHand"); }

      var INK = IF.ADEM.ink, PAPER = IF.ADEM.paper, DIM = "#8A857A";
      var BLUE = "#2F6FA8";                  // short wavelengths, and nothing else
      var WARM = "#C8562B";                  // long ones, and nothing else
      var EV = window.EV, DUR = EV.duration, E = EV.events, CUT = EV.cuts;

      var CX = 360, GROUND = 1090, SCALE = 1.30;
      var MM = (SCALE * 534) / 1750;
      function mm(v) { return v * MM; }

      var skyG = document.getElementById("sky"), beamG = document.getElementById("beam");
      var notes = document.getElementById("notes");
      var camera = document.getElementById("camera"), overlay = document.getElementById("overlay");
      var defs = document.querySelector("defs");

      function node(tag, a, parent) {
        var n = document.createElementNS(NS, tag);
        for (var k in a) n.setAttribute(k, a[k]);
        parent.appendChild(n); return n;
      }
      function stroke(d, sw, color, parent) {
        return node("path", { d: d, fill: "none", stroke: color || INK, "stroke-width": sw || 3,
                              "stroke-linecap": "round", "stroke-linejoin": "round" }, parent);
      }
      var seed = 20260910;
      function rnd() { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296 - 0.5; }
      function u1() { return rnd() + 0.5; }
      function seg(a, b, amp, step) {
        var n = Math.max(1, Math.round(Math.hypot(b[0]-a[0], b[1]-a[1]) / (step || 100))), o = [], i;
        for (i = 0; i <= n; i++) { var t = i/n, e = (i===0||i===n) ? 0 : 1;
          o.push([a[0]+(b[0]-a[0])*t + rnd()*amp*2*e, a[1]+(b[1]-a[1])*t + rnd()*amp*2*e]); }
        return o;
      }
      function dd(p) { var s = "", i; for (i=0;i<p.length;i++) s += (i?"L":"M") + p[i][0].toFixed(1) + " " + p[i][1].toFixed(1) + " "; return s; }
      function line(x0,y0,x1,y1,sw,parent,color,amp) {
        return stroke(dd(seg([x0,y0],[x1,y1], amp==null?1.2:amp, 110)), sw, color, parent);
      }
      function drawOn(el, t, dur, ease) {
        var L = el.getTotalLength();
        el.style.strokeDasharray = L; el.style.strokeDashoffset = L;
        tl.to(el, { strokeDashoffset: 0, duration: dur, ease: ease || "none" }, t);
        tl.set(el, { strokeDasharray: "none" }, t + dur);
      }

      // == SETUP A -- outside ==============================================
      // Line weight 3 for structure and 2 for detail. A set drawn heavier than
      // the figure makes him look pasted into somebody else's drawing.
      var SET = [];
      function A(e) { SET.push(e); return e; }
      A(line(-60, GROUND, 1140, GROUND, 3, skyG, INK, 1.6));
      A(line(-60, GROUND + 28, 1140, GROUND + 28, 2, skyG, DIM));
      A(stroke("M620 " + GROUND + " q120 -104 236 -74 q90 24 144 74", 2, DIM, skyG));
      A(node("path", { d: "M96 " + GROUND + " l0 -70 l70 0 l0 70 Z", fill: PAPER, stroke: INK, "stroke-width": 3 }, skyG));
      A(stroke("M131 " + (GROUND-70) + " q-44 -58 -14 -104 q34 42 18 104" +
               " M131 " + (GROUND-70) + " q46 -48 64 -12 q-40 6 -58 38", 2, DIM, skyG));

      // THE SUN, the only thing in this film that moves between shots.
      var sunG = node("g", {}, skyG);
      (function () {
        var d = "", i, a;
        for (i = 0; i < 12; i++) {
          a = i / 12 * Math.PI * 2;
          d += "M" + (Math.cos(a) * 62).toFixed(1) + " " + (Math.sin(a) * 62).toFixed(1) +
               " L" + (Math.cos(a) * 84).toFixed(1) + " " + (Math.sin(a) * 84).toFixed(1) + " ";
        }
        A(stroke(d, 3, INK, sunG));
      })();
      A(node("circle", { cx: 0, cy: 0, r: 46, fill: PAPER, stroke: INK, "stroke-width": 3 }, sunG));
      var SUN = { x: 830, y: 296, s: 1 };
      function placeSun() {
        sunG.setAttribute("transform", "translate(" + SUN.x.toFixed(1) + "," + SUN.y.toFixed(1) +
                          ") scale(" + SUN.s.toFixed(3) + ")");
      }
      placeSun();

      // The sky, drawn out of the same dots the diagram is made of, because
      // that is what a sky IS: light that was knocked sideways on its way past.
      function stipple(parent, n, x0, x1, y0, y1, r, colour, skip) {
        var g = node("g", {}, parent), i, x, y, guard = 0;
        for (i = 0; i < n; i++) {
          x = x0 + u1() * (x1 - x0); y = y0 + u1() * (y1 - y0);
          if (skip && x > skip[0] && x < skip[1] && y > skip[2] && guard++ < n * 6) { i--; continue; }
          node("circle", { cx: x.toFixed(1), cy: y.toFixed(1),
                           r: (r * (0.6 + 0.8 * u1())).toFixed(2), fill: colour }, g);
        }
        return g;
      }
      var blueSky = stipple(skyG, 120, 40, 1030, 220, 900, 4.4, BLUE, [225, 525, 380]);
      var warmSky = stipple(skyG, 96, 40, 1030, 700, 1070, 5.0, WARM, [225, 525, 700]);
      gsap.set(blueSky, { opacity: 0.62 });
      gsap.set(warmSky, { opacity: 0 });

      // THE BLUE COMING DOWN. On the noon beat he is standing under the exact
      // thing the diagram just showed, and the line under him says the blue he
      // sees was knocked out of somebody else's sunbeam -- so a dozen of them
      // come down out of that sky and into his eye. Same colour, same dot, same
      // size as the ones leaving the beam two cuts earlier: they are meant to
      // be recognised as the same photons.
      var FALL = [], fallEl = [];
      (function () {
        for (var i = 0; i < 16; i++) {
          FALL.push({ x0: 150 + u1() * 830, y0: 240 + u1() * 300, t0: 20.95 + i * 0.118 });
          fallEl.push(node("circle", { cx: -60, cy: -60, r: 7.0, fill: BLUE, opacity: 0 }, skyG));
        }
      })();
      var SEEN = [346, 508];                 // roughly where his eye is
      function skyfall(t) {
        var i, f, u, e;
        for (i = 0; i < FALL.length; i++) {
          f = FALL[i]; e = fallEl[i]; u = (t - f.t0) / 1.62;
          if (u <= 0 || u >= 1) { e.setAttribute("opacity", 0); continue; }
          e.setAttribute("cx", (f.x0 + (SEEN[0] - f.x0) * u).toFixed(1));
          e.setAttribute("cy", (f.y0 + (SEEN[1] - f.y0) * u).toFixed(1));
          e.setAttribute("opacity",
            Math.min(u < 0.14 ? u / 0.14 : 1, Math.min(1, (1 - u) / 0.24)).toFixed(3));
        }
      }

      // == THE FIGURE ======================================================
      var mount = document.getElementById("actorMount");
      var pup = IP.create(mount, { cx: CX, ground: GROUND, boil: "boil",
                                   headR: IF.ADEM.headR - 2, strokeWidth: 3 });
      var actorScale = document.getElementById("actorScale");
      actorScale.setAttribute("transform",
        "translate(" + CX + "," + GROUND + ") scale(" + SCALE + ") translate(" + (-CX) + "," + (-GROUND) + ")");
      var fig = IF.attach(pup, { unit: SCALE });
      IP.still("shuffle", 34);
      fig.carry.from = "point"; fig.hold.from = "point";

      // == SETUP B -- one beam, and two marks on it =========================
      // The band of air. Its thickness is not the point and is never mentioned;
      // the point is the distance ALONG it, which is why it is drawn wide and
      // shallow and the beam runs the full width of the frame.
      var BY = 700, BX0 = 74;
      var airTop = line(40, 388, 1040, 388, 2, beamG, DIM, 1.0);
      var airBot = line(40, 1012, 1040, 1012, 2, beamG, DIM, 1.0);
      (function () {                       // a few specks of air to be knocked off
        var i, x, y;
        for (i = 0; i < 54; i++) {
          x = 60 + u1() * 960; y = 400 + u1() * 600;
          node("circle", { cx: x.toFixed(1), cy: y.toFixed(1), r: 2.2, fill: DIM, opacity: 0.5 }, beamG);
        }
      })();
      IA.words(beamG, 44, 364, "air", { size: 34, color: DIM });
      // the sun this beam left, sitting on the edge of the page
      var beamSun = node("g", { transform: "translate(24," + BY + ")" }, beamG);
      (function () {
        var d = "", i, a;
        for (i = 0; i < 12; i++) { a = i / 12 * Math.PI * 2;
          d += "M" + (Math.cos(a)*52).toFixed(1) + " " + (Math.sin(a)*52).toFixed(1) +
               " L" + (Math.cos(a)*70).toFixed(1) + " " + (Math.sin(a)*70).toFixed(1) + " "; }
        stroke(d, 3, INK, beamSun);
      })();
      node("circle", { cx: 0, cy: 0, r: 40, fill: PAPER, stroke: INK, "stroke-width": 3 }, beamSun);

      // THE TWO MARKS. Same line, two distances. This is the whole argument
      // and it is two vertical ticks.
      function markAt(x, label) {
        var g = node("g", {}, beamG);
        var t = stroke("M" + x + " 356 L" + x + " 1044", 2, DIM, g);
        t.setAttribute("stroke-dasharray", "8 10");
        IA.words(g, x - 66, 1094, label, { size: 40, color: INK });
        gsap.set(g, { opacity: 0 });
        return g;
      }
      var markNoon = markAt(392, "noon");
      var markSet  = markAt(918, "sunset");

      // -- THE PHOTONS -----------------------------------------------------
      // Two hundred of them on a fixed launch schedule, one constant speed,
      // and exactly one event each: blue ones turn out of the beam early, red
      // ones almost never do. Everything the diagram claims is a consequence
      // of those two distributions, not of a keyframe.
      //
      // THEY RECYCLE. The first version launched each photon once, so the
      // schedule ran out at t=20.7 and the entire second half of the film --
      // the sunset half, the half the film is named after -- was an empty
      // pair of lines. A stream has to be a stream for as long as it is on
      // screen. Each photon relaunches every CYCLE seconds and draws a fresh
      // scatter distance and angle from a hash of (index, cycle), so it is
      // deterministic, seek-safe, and never repeats a pattern.
      var V = 268;                       // px per second, and it never changes
      var NPH = 230, DT = 0.068, CYCLE = NPH * DT;      // 15.6 s of traffic
      var PH = [], phEl = [];
      function h1(a) {
        a = (a * 1664525 + 1013904223) >>> 0;
        a ^= a >>> 15; a = (a * 2246822519) >>> 0;
        return a / 4294967296;
      }
      (function () {
        for (var i = 0; i < NPH; i++) {
          var blue = (i % 5) !== 4 && (i % 5) !== 3;   // three blue to two red
          PH.push({ blue: blue, t0: i * DT, off: (h1(i * 31 + 5) - 0.5) * 38 });
          phEl.push(node("circle", { cx: -60, cy: -60, r: blue ? 7.0 : 7.8,
                                     fill: blue ? BLUE : WARM, opacity: 0 }, beamG));
        }
      })();
      var BEAM0 = E.beam_on;
      var FADE = 2.0;                    // how long a scattered photon stays on the page
      var VOUT = 0.72;                   // and how fast it drifts once it has left

      function photons(t) {
        var i, p, e, cyc, age, sx, ang, x, y, run, o;
        for (i = 0; i < NPH; i++) {
          p = PH[i]; e = phEl[i];
          age = t - BEAM0 - p.t0;
          if (age <= 0) { e.setAttribute("opacity", 0); continue; }
          cyc = Math.floor(age / CYCLE); age -= cyc * CYCLE;
          // 1/lambda^4 is brutal: blue is gone within a few hundred pixels,
          // red mostly makes it off the right of the page.
          sx = BX0 + (p.blue ? 24 + 560 * Math.pow(h1(i * 7919 + cyc * 104729), 1.7)
                             : 800 + 2600 * h1(i * 7919 + cyc * 104729));
          ang = (h1(i * 104729 + cyc * 7919 + 17) - 0.5) * 2.5;
          if (Math.abs(ang) < 0.36) ang += ang < 0 ? -0.36 : 0.36;
          x = BX0 + age * V;
          if (x <= sx) {                         // still in the beam
            y = BY + p.off; o = 1;
          } else {                               // it turned, and it keeps going
            run = age - (sx - BX0) / V;
            x = sx + run * V * VOUT * Math.cos(ang);
            y = BY + p.off + run * V * VOUT * Math.sin(ang);
            o = Math.max(0, 1 - run / FADE);     // out of the picture, out of the film
          }
          if (x > 1120 || y < 224 || y > 1180) o = 0;
          e.setAttribute("cx", x.toFixed(1));
          e.setAttribute("cy", y.toFixed(1));
          e.setAttribute("opacity", o.toFixed(3));
        }
      }
      gsap.set(beamG, { opacity: 0 });

      // == what is on screen ================================================
      var shown = { beam: 0 };
      var clockT = { v: 0 };

      var NAR = Object.keys(EV.narration);
      function speaking(t) {
        for (var i = 0; i < NAR.length; i++) {
          var at = EV.narration[NAR[i]];
          if (t >= at - 0.06 && t <= at + EV.durations[NAR[i]]) return 1;
        }
        return 0;
      }
      function mouthOpen(t) {
        if (!speaking(t)) return 0;
        var v = Math.sin(t * 19.7) + 0.7 * Math.sin(t * 31.3 + 1.1) + 0.5 * Math.sin(t * 11.9 + 2.4);
        var env = 0.66 + 0.34 * Math.sin(t * 2.7 + 0.4);
        return Math.max(0, Math.min(1, (Math.abs(v) * 0.58 - 0.17) * env * 1.6));
      }

      function sync() {
        var t = clockT.v, po = fig.pose();
        fig.face.open = mouthOpen(t);
        if (shown.beam) photons(t); else skyfall(t);
        placeSun();
        pup.setPose(po);
      }
      tl.to(clockT, { v: DUR, duration: DUR, ease: "none", onUpdate: sync }, 0);

      // -- the page draws itself -------------------------------------------
      SET.forEach(function (e, i) { drawOn(e, 0.02 + i * 0.034, 0.26); });
      fig.pencilIn(tl, { start: 0.18, each: 0.12 });
      fig.inkIn(tl, { at: 0.86, dur: 0.30 });
      IP.choreograph(tl, pup, [{ clip: "still", dur: DUR }], { start: 0 });
      function to(o, v, t) { v.onUpdate = sync; return tl.to(o, v, t); }

      // -- the cuts ---------------------------------------------------------
      function cut(t, name) {
        var b = name === "rule";
        tl.set([skyG, actorScale], { opacity: b ? 0 : 1 }, t);
        tl.set(beamG, { opacity: b ? 1 : 0 }, t);
        tl.call(function () { shown.beam = b ? 1 : 0; sync(); }, null, t);
      }
      cut(CUT.outside, "outside");
      cut(CUT.rule, "rule");
      cut(20.70, "outside");        // he looks up at the sky the diagram explains
      cut(24.60, "rule");
      cut(35.90, "outside");        // and the sun goes down on the last two lines

      to(fig.face, { brow: 3.6, duration: 0.40 }, 21.10);
      to(fig.face, { brow: 0, duration: 0.50 }, 23.60);
      to(fig.face, { turn: 1, duration: 0.55, ease: IT.ease.settle }, 40.10);

      // THE SUN GOES DOWN, and the sky turns over with it. Nothing else in the
      // last shot moves, because nothing else needs to.
      to(SUN, { x: 892, y: 1050, s: 1.34, duration: 3.6, ease: "power1.in" }, 36.30);
      tl.to(blueSky, { opacity: 0.10, duration: 3.4 }, 36.40);
      tl.to(warmSky, { opacity: 0.70, duration: 3.4 }, 36.60);

      tl.to(markNoon, { opacity: 1, duration: 0.36 }, 17.00);
      tl.to(markSet,  { opacity: 1, duration: 0.36 }, 25.40);
      drawOn(airTop, CUT.rule + 0.10, 0.50);
      drawOn(airBot, CUT.rule + 0.22, 0.50);

      // -- the annotation layer ---------------------------------------------
      // Two labels, and they name the one thing the captions cannot: which
      // dots are which. After that the colours carry it alone.
      IA.callout(tl, notes, { at: 9.30, out: 12.60, text: "blue", size: 40, color: BLUE,
                              x: 96, y: 306, to: [330, 546], bend: -18 });
      IA.callout(tl, notes, { at: 13.00, out: 16.00, text: "red", size: 40, color: WARM,
                              x: 726, y: 1152, to: [700, 754], bend: 26 });

      // -- captions ---------------------------------------------------------
      var TXT = {
        s01: "The sky is blue. The sunset is red.<br>Same sun, same air.",
        s02: "Same reason, too.",
        s03: "Air scatters short wavelengths hard,<br>and long ones barely at all.",
        s04: "So <b style='color:#2F6FA8'>blue</b> gets knocked sideways.<br><b style='color:#C8562B'>Red</b> carries on straight.",
        s05: "At noon you are not looking<br>at the sun. You are looking at air.",
        s06: "The blue you see was knocked out<br>of somebody else's sunbeam.",
        s07: "At sunset the light comes in low,<br>through far more air.",
        s08: "By the time it reaches you,<br>the blue has been knocked out of it.",
        s09: "What arrives is<br>what nobody scattered.",
        s10: "So a red sunset is not<br>the sun changing colour.",
        s11: "It is the leftovers of a blue sky<br>happening somewhere else."
      };
      var DURS = EV.durations, ids = Object.keys(TXT);
      ids.forEach(function (id, i) {
        var at = EV.narration[id], d_ = document.createElement("div");
        d_.className = "cap"; d_.innerHTML = TXT[id];
        overlay.appendChild(d_);
        var next = ids[i+1] ? EV.narration[ids[i+1]] - 0.24 : 1e9;
        var out = i === ids.length - 1 ? at + DURS[id] + 0.50 : Math.min(at + DURS[id] + 0.16, next);
        tl.to(d_, { opacity: 1, duration: 0.18 }, at - 0.10);
        tl.to(d_, { opacity: 0, duration: 0.20 }, out);
      });

      // -- the channel -------------------------------------------------------
      var brandLayer = document.getElementById("brandLayer");
      InkBrand.mark(defs, brandLayer, { x: 46, y: 54, w: 128, ink: INK, accent: BLUE, opacity: 0.70 });
      InkBrand.subscribe(tl, brandLayer, { at: EV.subscribe_at, accent: BLUE, ink: INK, paper: PAPER });

      sync();
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
