copy:
  title: "The clock isn't broken. You were."
  hook: "Look at a clock with a second hand. The first second is too long. Every time."
  caption: >-
    Your eyes don't glide, they jump — three or four times a second — and the
    picture is switched off while they move. Your brain fills the gap
    backwards, with whatever you land on. That's the long second: a blank,
    painted over with the clock.
  description: |-
    Look at a clock with a second hand. The first second is too long — every time.

    Your eyes do not glide, they jump, three or four times a second, and the picture is switched off while they move. Your brain fills the gap backwards with whatever you land on. The long second is a blank, painted over with the clock.

    Source: Yarrow et al., Nature (2001).

