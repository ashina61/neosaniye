copy:
  title: "You cannot tickle yourself. Here is why."
  hook: "Try it. Nothing happens — and it is not because you are doing it wrong."
  caption: >-
    Every time you move, your brain sends the order to your muscles and a copy
    of that order somewhere else, and the copy is used to work out in advance
    exactly what you are about to feel. Then it subtracts it. What reaches you
    is only the difference — everything you did not see coming.
  description: |-
    You cannot tickle yourself, and it is not because you are doing it wrong.

    Your brain sends the order to your muscles and a copy of that order somewhere else, and the copy predicts exactly what you are about to feel. Then it subtracts it. What reaches you is only what you did not see coming.

    Source: Blakemore, Wolpert & Frith, Nature Neuroscience 1 (1998).

