<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      THE DOORWAY DID IT — ink-sketch, atelier, HyperFrames.

      One continuous shot. The figure is pinned at screen x 540 because
      InkPuppet.place() rewrites its transform every frame; travel is therefore
      expressed by sliding #world past it, which also puts the doorway's arrival
      under exact timeline control — the swipe has to land on one word.

      Every movement the character makes is a named CMU motion-capture clip.
      Nothing about the acting is authored here. See
      ../artifacts/rig_plan.json and productions/STYLE_LEDGER.md.

      gsap is vendored rather than hot-linked: cdn.jsdelivr.net is denied by this
      environment's network policy, and a render-time fetch would break
      determinism anyway. The handwriting is the FULL Patrick Hand TTF — a Google
      Fonts css2 subset is missing basic-latin and falls back to serif silently
      while the renderer still reports the font as loaded.
    -->
    <script src="gsap.min.js"></script>
    <script src="ink-theater.js"></script>
    <script src="ink-puppet.js"></script>
    <script src="ink-figure.js"></script>
    <script src="clips.js"></script>
    <script src="captions.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      @font-face { font-family: "InkHand"; src: url("assets/patrickhand.ttf") format("truetype"); font-display: block; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #FCFBF8; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .stage { position: absolute; inset: 0; background: #FCFBF8; }
      .stage svg { position: absolute; inset: 0; display: block; width: 1080px; height: 1920px; }
      #overlay { position: absolute; inset: 0; }

      /* the chip: an index mark, not a pill — a short rule and letterspaced caps */
      #chipRow { position: absolute; left: 64px; top: 132px; display: flex; align-items: center; gap: 18px; opacity: 0; }
      #chipBar { width: 6px; height: 34px; background: #333; }
      .chip { position: absolute; left: 88px; top: 136px; font-family: "InkHand", cursive;
              font-size: 34px; letter-spacing: 0.12em; color: #333; opacity: 0; white-space: nowrap; }

      /* captions live in the clear band under the figure's feet */
      .cap { position: absolute; left: 60px; width: 960px; top: 1420px; text-align: center;
             font-family: "InkHand", cursive; font-size: 62px; line-height: 1.2; color: #333; opacity: 0; }
      .cap b { font-weight: normal; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="47.033"
         data-width="1080" data-height="1920" data-fps="30">
      <section id="scene-doorway" class="clip" data-start="0" data-duration="47.033">
        <div class="stage">
          <svg viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <filter id="boil" x="-20%" y="-20%" width="140%" height="140%">
                <feTurbulence id="boilTurb" type="fractalNoise" baseFrequency="0.012" numOctaves="1" seed="1" result="n"/>
                <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"/>
              </filter>
            </defs>
            <g id="camera">
              <g id="world" filter="url(#boil)"></g>
              <g id="actorScale">
                <g id="actorFace">
                  <g id="actorMount"></g>
                </g>
              </g>
            </g>
            <g id="fx"></g>
          </svg>
          <div id="overlay">
            <div id="chipRow"><div id="chipBar"></div></div>
          </div>
        </div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      if (document.fonts && document.fonts.load) { document.fonts.load("62px InkHand"); }

      var IT = window.InkTheater, IP = window.InkPuppet;
      var tl = gsap.timeline({ paused: true });
      var SVGNS = "http://www.w3.org/2000/svg";

      // ── the page ─────────────────────────────────────────────────────────
      var INK = "#333333", ERRAND = "#D4611B", PROBLEM = "#C8322B", RESOLVE = "#2E6E9E", DIM = "#8A857A";
      var CX = 540, GROUND = 1180, LINTEL = 420, DOOR_X = 880, BOX_X = 770;
      var ARM_Y = 728, ARM_LEN = 310;   // both solved, not chosen: ARM_Y is the
                                  // screen height the carried errand actually
                                  // sits at (the actor is scaled 1.5x about the
                                  // ground, so it is not the figure's own hand
                                  // height), and ARM_LEN puts the paddle on the
                                  // errand at exactly SWIPE. Folded up the post
                                  // the tip lands on the lintel, which is why
                                  // the arm reads as part of the doorway.
      var world = document.getElementById("world"), fx = document.getElementById("fx");
      var overlay = document.getElementById("overlay"), camera = document.getElementById("camera");

      function node(tag, a, parent) {
        var n = document.createElementNS(SVGNS, tag);
        for (var k in a) n.setAttribute(k, a[k]);
        (parent || world).appendChild(n); return n;
      }
      function stroke(d, sw, color, parent) {
        return node("path", { d: d, fill: "none", stroke: color || INK, "stroke-width": sw || 6,
                              "stroke-linecap": "round", "stroke-linejoin": "round" }, parent);
      }
      function drawOn(el, t, dur, ease) {                // the pencil draws it in
        var L = el.getTotalLength();
        el.style.strokeDasharray = L; el.style.strokeDashoffset = L;
        tl.to(el, { strokeDashoffset: 0, duration: dur, ease: ease || "none" }, t);
        tl.set(el, { strokeDasharray: "none" }, t + dur);
      }

      // ── the floor ────────────────────────────────────────────────────────
      var ground = stroke(IT.inkPath([[-1500, GROUND], [0, GROUND + 3], [1200, GROUND - 2], [2600, GROUND + 3]],
                                     { wobble: 2.0, step: 90 }), 5, INK);
      gsap.set(ground, { opacity: 0 });
      tl.to(ground, { opacity: 1, duration: 0.5 }, 3.9);

      // ── the measured rule (b03) ──────────────────────────────────────────
      var ruleY = GROUND + 66;
      var ruleG = node("g", {});
      var rule = stroke(IT.inkPath([[120, ruleY], [560, ruleY + 2], [1000, ruleY]], { wobble: 1.4, step: 70 }), 4, DIM, ruleG);
      stroke("M 120 " + (ruleY - 18) + " L 120 " + (ruleY + 18), 4, DIM, ruleG);
      stroke("M 1000 " + (ruleY - 18) + " L 1000 " + (ruleY + 18), 4, DIM, ruleG);
      gsap.set(ruleG, { opacity: 0 });
      tl.to(ruleG, { opacity: 1, duration: 0.4 }, 6.3);
      drawOn(rule, 6.3, 1.5);
      tl.to(ruleG, { opacity: 0, duration: 0.4 }, 11.3);

      // ── the doorway, and the arm on it ───────────────────────────────────
      // The arm is a barrier: hinged on the left upright at hand height, folded
      // flat up the post at rest, and it drops to horizontal to sweep straight
      // through the threshold. Nothing about it is decorative — its pivot, its
      // length and the moment it falls are all set by where the hand will be.
      var door = node("g", {});
      gsap.set(door, { opacity: 0 });
      tl.to(door, { opacity: 1, duration: 0.001 }, 3.88);
      var upL = stroke(IT.inkPath([[DOOR_X - 130, GROUND], [DOOR_X - 135, 800], [DOOR_X - 130, LINTEL]], { wobble: 1.8, step: 100 }), 8, INK, door);
      var upR = stroke(IT.inkPath([[DOOR_X + 130, GROUND], [DOOR_X + 136, 800], [DOOR_X + 130, LINTEL]], { wobble: 1.8, step: 100 }), 8, INK, door);
      var lint = stroke(IT.inkPath([[DOOR_X - 152, LINTEL], [DOOR_X, LINTEL - 7], [DOOR_X + 152, LINTEL]], { wobble: 1.8, step: 80 }), 8, INK, door);
      var armPivot = (DOOR_X - 130) + " " + ARM_Y;
      var armG = node("g", { transform: "translate(" + (DOOR_X - 130) + "," + ARM_Y + ") rotate(-90)" }, door);
      var arm = stroke("M 0 0 L " + ARM_LEN + " 0", 8, INK, armG);
      var paddle = node("rect", { x: ARM_LEN - 26, y: -30, width: 30, height: 60, rx: 4, fill: INK }, armG);
      node("circle", { cx: 0, cy: 0, r: 9, fill: INK }, armG);
      // hatch above the lintel, so the frame reads as a hole in a wall rather
      // than as a goalpost standing in space
      var hatch = [];
      for (var h = 0; h < 6; h++) {
        var hx = DOOR_X - 148 + h * 59;
        hatch.push(stroke("M " + hx + " " + (LINTEL - 4) + " L " + (hx + 44) + " " + (LINTEL - 74), 5, INK, door));
      }
      // "Step over the line" is in the narration, so there is a line
      var sill = stroke("M " + DOOR_X + " " + (GROUND - 26) + " L " + DOOR_X + " " + (GROUND + 12), 6, DIM, door);
      drawOn(upL, 3.90, 0.44); drawOn(upR, 4.18, 0.44); drawOn(lint, 4.46, 0.42);
      drawOn(sill, 4.90, 0.22);
      hatch.forEach(function (e, i) { drawOn(e, 4.60 + i * 0.05, 0.16); });
      drawOn(arm, 4.76, 0.32);
      gsap.set(paddle, { opacity: 0 });
      tl.to(paddle, { opacity: 1, duration: 0.18 }, 5.02);

      // cocked past vertical, like a trap being set — then the swipe
      var SWIPE = 20.33;
      tl.set(armG, { svgOrigin: armPivot }, 0);
      tl.to(armG, { rotation: -108, duration: 0.55, ease: IT.ease.settle }, 13.5);
      // the fall LANDS on the word rather than starting on it — the arm has to
      // already be through the errand at SWIPE, not just beginning to move
      tl.to(armG, { rotation: 0, duration: 0.15, ease: "power3.in" }, SWIPE - 0.15);
      tl.to(armG, { rotation: -14, duration: 0.7, ease: IT.ease.settle }, SWIPE + 0.34);
      // and then it folds itself back up the post, innocent. Left horizontal it
      // also draws a bar straight across the figure for the remaining 26
      // seconds, which is the kind of thing only a render shows you.
      tl.to(armG, { rotation: -90, duration: 0.9, ease: IT.ease.settle }, 21.30);

      // ── the box the errand ends up in ────────────────────────────────────
      function makeBox(x, opts) {
        opts = opts || {};
        var w = 176, h = 142, g = node("g", {}, opts.parent || world);
        var body = stroke("M " + (x - w / 2) + " " + GROUND + " L " + (x - w / 2) + " " + (GROUND - h) +
                          " M " + (x + w / 2) + " " + GROUND + " L " + (x + w / 2) + " " + (GROUND - h) +
                          " M " + (x - w / 2) + " " + GROUND + " L " + (x + w / 2) + " " + GROUND +
                          " M " + (x - w / 2 + 34) + " " + (GROUND - 6) + " L " + (x - w / 2 + 34) + " " + (GROUND - h + 4), 6, INK, g);
        var lidG = node("g", {}, g);
        var lid = stroke("M " + (x - w / 2 - 13) + " " + (GROUND - h) + " L " + (x + w / 2 + 13) + " " + (GROUND - h) +
                         " M " + (x - w / 2 - 13) + " " + (GROUND - h + 13) + " L " + (x + w / 2 + 13) + " " + (GROUND - h + 13), 6, INK, lidG);
        return { g: g, body: body, lid: lid, lidG: lidG, x: x, top: GROUND - h };
      }
      var box = makeBox(BOX_X);
      gsap.set(box.g, { opacity: 0 });
      gsap.set(box.lidG, { y: -230, opacity: 0 });
      tl.to(box.g, { opacity: 1, duration: 0.001 }, SWIPE + 0.06);
      tl.to(box.lidG, { opacity: 1, duration: 0.001 }, SWIPE + 0.20);
      tl.to(box.lidG, { y: 0, duration: 0.14, ease: "power4.in" }, SWIPE + 0.20);
      tl.to(box.lidG, { y: 0, duration: 0.3, ease: IT.ease.bouncy }, SWIPE + 0.34);

      // the seam goes red once, and only here
      var seam = stroke("M " + (BOX_X - 100) + " " + (GROUND - 142) + " L " + (BOX_X + 100) + " " + (GROUND - 142), 9, PROBLEM);
      gsap.set(seam, { opacity: 0 });
      tl.to(seam, { opacity: 1, duration: 0.12 }, 30.15);
      tl.to(seam, { opacity: 0, duration: 0.7 }, 30.65);

      // ── the line of finished rooms, revealed at the end ──────────────────
      var line = [], LINE_X = [];
      for (var i = 1; i <= 7; i++) LINE_X.push(BOX_X - i * 200);
      LINE_X.forEach(function (x, i) {
        var b = makeBox(x);
        gsap.set(b.g, { opacity: 0 });
        gsap.set(b.lidG, { y: 0 });
        tl.to(b.g, { opacity: 1, duration: 0.35 }, 38.4 + i * 0.20);
        line.push(b);
      });
      // one blue stroke along every closed lid — the only blue in the video
      var blueD = "M " + (LINE_X[LINE_X.length - 1] - 100) + " " + (GROUND - 154) +
                  " L " + (BOX_X + 100) + " " + (GROUND - 154);
      var blue = stroke(blueD, 13, RESOLVE);
      drawOn(blue, 41.4, 2.6, "power1.inOut");

      // ── the figure ───────────────────────────────────────────────────────
      var mount = document.getElementById("actorMount");
      var pup = IP.create(mount, { cx: CX, ground: GROUND, boil: "boil", headR: 44, strokeWidth: 7 });
      document.getElementById("actorScale").setAttribute(
        "transform", "translate(" + CX + "," + GROUND + ") scale(1.5) translate(" + (-CX) + "," + (-GROUND) + ")");
      var face = document.getElementById("actorFace");

      // The rig supplies the motion; InkFigure supplies the drawing. Same pose,
      // same clips, same determinism — a brush instead of a wireframe.
      var fig = window.InkFigure.attach(pup, { headR: 46, color: INK });

      // the errand rides in the near hand, in the figure's own local space
      var errand = node("g", {}, pup.ink);
      node("circle", { cx: 0, cy: 0, r: 23, fill: ERRAND }, errand);
      node("path", { d: "M -9 -22 L 0 -36 L 9 -22", fill: "none", stroke: ERRAND,
                     "stroke-width": 7, "stroke-linecap": "round" }, errand);
      gsap.set(errand, { opacity: 0 });

      var posed = pup.setPose;
      pup.setPose = function (po) {
        posed(po);
        var h = fig.hand();     // where the hand ended up AFTER the IK, not before
        errand.setAttribute("transform", "translate(" + h[0] + "," + (h[1] + 24) + ")");
      };
      pup.setPose(IP.STAND); pup.place(IP.STAND.groundY, 0);

      // The figure has to be redrawn on every frame of the film, not only on the
      // frames a mocap segment is running — otherwise the arm cannot move before
      // the choreography starts or between its segments. Added after the
      // choreograph tweens so it always draws last.
      var tick = { v: 0 };

      // 1) the pencil roughs it in, then the ink goes on over it and the pencil
      //    is rubbed out — which is how anybody actually draws a person
      fig.pencilIn(tl, { start: 0.15, each: 0.34 });
      fig.inkIn(tl, { at: 1.95, dur: 0.60 });
      tl.fromTo(errand, { opacity: 0, scale: 0.2, svgOrigin: "0 0" },
                        { opacity: 1, scale: 1, duration: 0.5, ease: IT.ease.overshoot }, 2.60);

      // 2) the acting — named clips only, and never the same one twice running
      IP.choreograph(tl, pup, [
        { clip: "march",   dur: 5.30 },   // 6.00  going nowhere, on purpose
        { clip: "walk",    dur: 11.00 },  // 11.30 the approach and the crossing
        { clip: "shuffle", dur: 3.90 },   // 22.30 searching an empty room
        { clip: "walk",    dur: 3.40 },   // 26.20 walking back (mirrored)
        { clip: "kick",    dur: 4.40 },   // 29.60 the box does not move
        // loop:false matters here — the sit clip is exactly 6.00s, so a 6.60s
        // segment would wrap and start sitting down again. Held on its last
        // frame, it leaves the figure standing, which is the ending.
        { clip: "sit",     dur: 6.60, loop: false }   // 34.00 sits, then stands
      ], { start: 6.00 });

      // setPose, not fig.redraw() — redraw only repaints the figure, and the
      // errand is parented to the hand by this file, so it has to go through
      // the same wrapper the choreography does or it stops following the hand.
      function repose() { pup.setPose(fig.pose()); }
      tl.to(tick, { v: 1, duration: 47.033, ease: "none", onUpdate: repose }, 0);

      // Every tween that moves the arm has to repose the figure itself. A gsap
      // timeline renders its children in start-time order, so this one — which
      // starts at 0 — always draws BEFORE the carry tweens below have written
      // their values for the frame, and the figure comes out one render behind
      // its own gesture. Sequentially that is 33ms; on a seek it is whatever
      // the last seek left behind, which is how it was found.
      var REPOSE = { onUpdate: repose, onComplete: repose };
      function carryTo(v, at) { tl.to(fig.carry, Object.assign({}, v, REPOSE), at); }
      function carrySet(v, at) { tl.set(fig.carry, Object.assign({}, v, REPOSE), at); }

      // ── what the near arm is doing ───────────────────────────────────────
      // The body stays on motion capture throughout. Only this one arm is
      // overridden, and only when the story needs the hand to be somewhere:
      // holding the errand, being robbed of it, and looking at itself empty.
      // A generic walk cycle swings an empty arm, so an object riding in that
      // hand reads as swinging loose rather than being carried.
      carryTo({ on: 1, duration: 0.45, ease: IT.ease.settle }, 2.55);   // takes hold

      // held further out through the march. That clip is shot nearly in
      // profile, so both shoulders sit on the spine and a close carry folds the
      // arm up and parks the errand on top of the legs; further out straightens
      // the arm and clears them. It settles back as the walk begins.
      carryTo({ dx: 70, duration: 0.5, ease: IT.ease.settle }, 5.90);
      carryTo({ dx: 39, duration: 0.6, ease: IT.ease.settle }, 11.30);

      // the yank: the arm is pulled out and back as the errand is scraped away
      carryTo({ dx: 65, dy: 105, duration: 0.10, ease: "power3.in" }, SWIPE);
      carryTo({ on: 0, duration: 0.45, ease: IT.ease.soft }, SWIPE + 0.16);
      carrySet({ dx: 39, dy: 123 }, SWIPE + 0.70);

      // it looks at the hand that is not holding anything
      carrySet({ from: "shoulder", dx: 118, dy: -6 }, 22.85);
      carryTo({ on: 1, duration: 0.5, ease: IT.ease.settle }, 22.90);
      carryTo({ on: 0, duration: 0.6, ease: IT.ease.soft }, 25.10);
      carrySet({ dx: 39, dy: 123 }, 25.80);

      // and it swipes at one of the errands crowding its head, and misses
      carrySet({ dx: 70, dy: -110 }, 35.10);
      carryTo({ on: 0.9, duration: 0.28, ease: "power2.out" }, 35.15);
      carryTo({ on: 0, duration: 0.5, ease: IT.ease.soft }, 35.90);
      carrySet({ dx: 39, dy: 123 }, 36.50);

      // the turn: the only time it changes facing
      // svgOrigin, not transformOrigin: face is an SVG <g>, so the origin is in
      // user units. Getting this wrong throws the whole figure off the page and
      // it is invisible in a still — it only shows up when you watch the render.
      tl.to(face, { scaleX: -1, duration: 0.26, ease: IT.ease.settle,
                    svgOrigin: CX + " " + GROUND }, 26.20);

      // 3) the world slides past it
      tl.set(world, { x: 0 }, 0);
      // -414 over 11.00s is 37.6 px/s, which puts the threshold on the figure at
      // exactly SWIPE. The rate is derived from the word, not chosen.
      tl.to(world, { x: -414, duration: 11.00, ease: "none" }, 11.30);   // out
      // ends 100px short of centre so the figure stands BESIDE the box it comes
      // back for, not on top of it — otherwise its own legs hide the red seam
      tl.to(world, { x: -330, duration: 3.40, ease: "none" }, 26.20);    // back

      // 4) the errand is taken
      // in #fx, not #world: #world is painted before the actor, so an errand
      // knocked backwards past the body would spend its whole flight hidden
      // behind it. #fx is painted after, and 0.24s of scroll is 9px, which is
      // nothing against a 176-wide box.
      var W_SWIPE = -339.9;                       // world offset at SWIPE
      var falling = node("g", {}, fx);
      node("circle", { cx: 0, cy: 0, r: 21, fill: ERRAND }, falling);
      node("path", { d: "M -8 -21 L 0 -34 L 8 -21", fill: "none", stroke: ERRAND, "stroke-width": 6, "stroke-linecap": "round" }, falling);
      // it leaves from where it was actually being held, not from the doorway —
      // starting it at DOOR_X teleports it 170px before it starts falling
      gsap.set(falling, { opacity: 0, x: 708, y: ARM_Y });   // where the hand was
      tl.to(errand, { opacity: 0, duration: 0.001 }, SWIPE + 0.05);
      tl.to(falling, { opacity: 1, duration: 0.001 }, SWIPE + 0.05);
      tl.to(falling, { x: BOX_X + W_SWIPE, duration: 0.24, ease: "power1.out" }, SWIPE + 0.05);
      tl.to(falling, { y: GROUND - 62, duration: 0.24, ease: "power2.in" }, SWIPE + 0.05);
      tl.to(falling, { opacity: 0, duration: 0.001 }, SWIPE + 0.30);

      // the hit itself. The barrier lives in #world, which is painted behind the
      // actor, so the middle of its swing passes behind the body and only the
      // paddle clears it. Three ink ticks in #fx put the contact on the front
      // plane, which is the whole point of the shot.
      var hit = node("g", {}, fx);
      [[-1, -0.9], [0.2, -1.25], [1.1, -0.35]].forEach(function (d) {
        stroke("M " + (708 + d[0] * 34) + " " + (ARM_Y + d[1] * 34) +
               " L " + (708 + d[0] * 76) + " " + (ARM_Y + d[1] * 76), 7, INK, hit);
      });
      gsap.set(hit, { opacity: 0, scale: 0.55, svgOrigin: "708 " + ARM_Y });
      tl.to(hit, { opacity: 1, scale: 1, duration: 0.09, ease: "power2.out" }, SWIPE);
      tl.to(hit, { opacity: 0, scale: 1.35, duration: 0.22, ease: "power1.in" }, SWIPE + 0.11);

      // 5) three more errands crowd the head — the honest qualifier
      var crowd = [];
      [[-150, -250], [140, -300], [-20, -370]].forEach(function (p, i) {
        var g = node("g", {}, fx);
        node("circle", { cx: 0, cy: 0, r: 23, fill: ERRAND }, g);
        gsap.set(g, { opacity: 0, x: CX + p[0], y: 500 + p[1] * 0.35 });
        tl.to(g, { opacity: 1, duration: 0.3 }, 34.3 + i * 0.22);
        tl.to(g, { y: "+=26", duration: 1.6, ease: IT.ease.soft }, 34.6 + i * 0.22);
        tl.to(g, { y: "-=26", duration: 1.6, ease: IT.ease.soft }, 36.2 + i * 0.22);
        tl.to(g, { opacity: 0, duration: 0.5 }, 37.9 + i * 0.1);
        crowd.push(g);
      });

      // 6) one speech balloon, and only one
      IT.balloon(tl, { into: fx, overlay: overlay, at: 23.05, dur: 2.6,
                       text: "why did I come in here", center: [700, 300], mouth: [566, 452],
                       w: 560, size: 48, boil: "boil" });

      // 7) the pull-back: the one box turns out to be the near end of a line
      tl.to(camera, { scale: 0.55, x: 220, y: -80, duration: 3.4, ease: IT.ease.soft,
                      svgOrigin: CX + " " + GROUND }, 37.7);

      // ── the chip and the captions ────────────────────────────────────────
      var CHIPS = [
        [0.55, 3.60, "nobody is immune"],
        [3.90, 5.85, "it's the door"],
        [6.05, 11.35, "they actually ran this"],
        [11.55, 15.55, "same walk, two endings"],
        [15.70, 22.95, "one room, one file"],
        [23.10, 29.10, "so go back"],
        [29.25, 34.00, "they tested that"],
        [34.10, 37.55, "only when you're full"],
        [37.70, 45.60, "what it bought"]
      ];
      var chipBar = document.getElementById("chipBar"), chipRow = document.getElementById("chipRow");
      tl.to(chipRow, { opacity: 1, duration: 0.3 }, 0.55);
      tl.to(chipRow, { opacity: 0, duration: 0.5 }, 45.6);
      CHIPS.forEach(function (c) {
        var d = document.createElement("div");
        d.className = "chip"; d.textContent = c[2];
        overlay.appendChild(d);
        tl.to(d, { opacity: 1, duration: 0.22 }, c[0]);
        tl.to(d, { opacity: 0, duration: 0.18 }, c[1]);
      });

      var CAPS = window.__CAPTIONS__ || [];
      var MARK = { errand: ERRAND, problem: PROBLEM, resolution: RESOLVE };
      CAPS.forEach(function (c) {
        var d = document.createElement("div");
        d.className = "cap";
        var mark = MARK[c.emphColor] || ERRAND;
        d.innerHTML = c.text.split(" ").map(function (w) {
          return (c.emph.indexOf(w) >= 0)
            ? '<b style="color:' + mark + '">' + w + "</b>" : w;
        }).join(" ");
        overlay.appendChild(d);
        var s = c.fromFrame / 30, e = (c.fromFrame + c.durationInFrames) / 30;
        tl.to(d, { opacity: 1, duration: 0.12 }, s);
        tl.to(d, { opacity: 0, duration: 0.12 }, Math.max(s + 0.2, e - 0.06));
      });

      IT.boil(document.getElementById("boilTurb"), tl, { duration: 47.033, fps: 9 });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
