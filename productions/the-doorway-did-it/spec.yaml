copy:
  title: "Why you forget the second you walk in."
  hook: "You walk into the kitchen with absolutely no idea why. It isn't your age. It's the door."
  caption: >-
    Psychologists made people carry an object between rooms, holding the
    distance constant. Cross a room and you remember; cross a doorway and you
    forget more. Your brain treats a room as one whole event and closes the file
    on the way out. And the advice everyone gives you — go back to where you
    were — was tested directly, and it did not help.
  description: |-
    You walk into the kitchen with absolutely no idea why. It is not your age. It is the door.

    Carry an object across a room and you remember it; carry it through a doorway and you forget more. Your brain treats a room as one whole event and closes the file on the way out. Going back does not help — that was tested.

    Source: Radvansky, Krawietz & Tamplin, QJEP (2011).

