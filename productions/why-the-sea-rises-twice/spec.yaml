copy:
  title: "The tide nobody can explain."
  hook: "There are two high tides a day. Only one of them makes any sense."
  caption: >-
    The Moon lifts the near ocean — fine. But twelve hours later the sea rises
    again on the side of the planet facing away, and the explanation most of us
    were taught for that one is named as a misconception in the physics
    literature. Nothing out there is being pushed. Gravity weakens with
    distance, so the planet is pulled out from under its own far-side water.
  description: |-
    There are two high tides a day. Only one of them makes any sense.

    The Moon lifts the near ocean — fine. Twelve hours later the sea rises on the side facing away, and nothing out there is being pushed. Gravity weakens with distance, so the planet is pulled out from under its own far-side water.

    Source: NOAA, Gravity, Inertia and the Two Bulges.

