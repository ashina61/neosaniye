copy:
  title: "Your headphones don't block sound. They add it."
  hook: "The noise is already on its way to your eardrum when the microphone hears it."
  caption: >-
    Noise cancelling has a deadline. Three centimetres of air is about 87
    microseconds — that is the entire window the headphone has to measure the
    wave, invert it and play it back. Land it 40 microseconds late and the
    cancelling starts to fail. Miss by 100 and, at 1 kHz, you are a tenth of a
    wave wrong. That is why an engine disappears and the person next to you
    does not.
  description: |-
    Noise cancelling has a deadline.

    The microphone hears the noise roughly 87 microseconds before your eardrum
    does — three centimetres of air at 343 m/s. In that window the headphone has
    to measure the wave, invert it and play it back. Land it 40 microseconds late
    and the cancelling starts to fail. Miss by 100 and, at 1 kHz, you are a tenth
    of a wave wrong.

    That single constraint explains the thing everyone complains about: an engine
    disappears and the person one seat away does not. Active cancellation covers
    roughly 50 Hz to 2 kHz. A voice lives above it. There is no time.

    The residual wave in this video is not drawn — it is the actual sum of the
    two traces, computed per sample.

    Sources
    US 9,786,264, feedforward time alignment:
