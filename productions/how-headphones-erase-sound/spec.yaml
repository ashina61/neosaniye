slug: how-headphones-erase-sound
title: The Deadline Inside Your Headphones
duration_seconds: 41.5
produced_by: openmontage/animated-explainer (atelier, remotion)
produced_on: "2026-09-03"

copy:
  title: "Your headphones don't block sound. They add it."
  hook: "The noise is already on its way to your eardrum when the microphone hears it."
  caption: >-
    Noise cancelling has a deadline. Three centimetres of air is about 87
    microseconds — that is the entire window the headphone has to measure the
    wave, invert it and play it back. Land it 40 microseconds late and the
    cancelling starts to fail. Miss by 100 and, at 1 kHz, you are a tenth of a
    wave wrong. That is why an engine disappears and the person next to you
    does not.
  description: |-
    Your headphones do not block sound. They add sound — the opposite one.

    Three centimetres of air is about 87 microseconds, and that is the entire window to hear the wave, invert it and play it back before it reaches your eardrum. Miss by 100 and at 1 kHz you are a tenth of a wave wrong. That is why an engine disappears and the person next to you does not.

